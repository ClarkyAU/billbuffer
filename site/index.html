<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bill Buffer</title>
<meta name="theme-color" content="#1E1D1B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:'Archivo';src:url(fonts/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:swap}
@font-face{font-family:'Onest';src:url(fonts/onest.woff2) format('woff2');font-weight:100 900;font-stretch:100%;font-style:normal;font-display:swap}

/* Bill Buffer. Neo-brutal, muted: thick outlines, hard offset shadows, dusty colour tiles, heavy Archivo numbers.
   One stylesheet: tokens, base, components, then the phone and wide-screen layouts. */
:root{
  color-scheme:light;
  --bg:#E6E1D6; --surface:#F6F3EC; --surface-2:#ECE7DC; --line:#CDC6B7; --ink:#191816; --muted:#5E584D;
  --edge:#191816; --shadow:#191816; --good:#2D7553; --bad:#A93B2C; --accent-soft:#EEDDB0;
  /* colour blocks keep dark text in both themes */
  --on-tile:#191816; --paper:#F6F3EC; --accent:#D6A84A;
  --t-blue:#7F92CC; --t-red:#D58A72; --t-mint:#9CC8B2; --t-lilac:#B9AED6; --t-sand:#E2D3B3; --t-white:#F6F3EC;
  --k0:#C9785F; --k1:#5C9FA4; --k2:#8F80C4; --k3:#C47390; --k4:#8C8678; --k5:#BF9A45; --k6:#78A777; --k7:#6F86C6;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1D1B; --surface:#2A2926; --surface-2:#34322E; --line:#47443E; --ink:#F1EDE4; --muted:#ABA497;
    --edge:#0B0B0A; --shadow:#000000; --good:#86C9A6; --bad:#E59985; --accent-soft:#4A3D1D; --t-sand:#D9C9A6; --t-white:#F1EDE4;
    --k0:#D9907A; --k1:#76B6BA; --k2:#A698D6; --k3:#D58BA6; --k4:#A39D90; --k5:#D3B160; --k6:#93C092; --k7:#8DA1DA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1D1B; --surface:#2A2926; --surface-2:#34322E; --line:#47443E; --ink:#F1EDE4; --muted:#ABA497;
  --edge:#0B0B0A; --shadow:#000000; --good:#86C9A6; --bad:#E59985; --accent-soft:#4A3D1D; --t-sand:#D9C9A6; --t-white:#F1EDE4;
  --k0:#D9907A; --k1:#76B6BA; --k2:#A698D6; --k3:#D58BA6; --k4:#A39D90; --k5:#D3B160; --k6:#93C092; --k7:#8DA1DA;
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(108px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:18px}
.eyebrow,.flabel,.field label,.gname,.wd,.cnum small,.calhead small,.tile .tl,.hbal label{font:800 12px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase}
.eyebrow{margin:0 0 6px;color:var(--muted)}
.flabel,.field label,.gname,.wd,.cnum small,.calhead small{color:var(--muted)}
.note{margin:10px 0 0;color:var(--muted);font-size:13.5px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cc,var(--k4));flex:none}
.chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-3px;transition:transform .15s}
.chev.r{transform:rotate(-45deg);margin-top:0}
details[open] .chev,li.open>.brow .chev{transform:rotate(-135deg);margin-top:3px}

/* ---------- header and navigation ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top small{color:var(--muted);font:700 13px var(--f-body)}
.brand{display:flex;align-items:center;gap:10px;margin:0;font:900 22px/1 var(--f-num);letter-spacing:-.01em}
.logo{position:relative;flex:none;width:30px;height:30px;overflow:hidden;border:2.5px solid var(--edge);border-radius:8px;background:var(--surface);box-shadow:2px 2px 0 var(--shadow)}
.logo::after{content:"";position:absolute;inset:auto 0 0 0;height:48%;background:var(--accent);border-top:2.5px solid var(--edge)}
.topnav{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:2.5px solid var(--edge);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{display:grid;justify-items:center;align-content:center;gap:4px;min-height:58px;background:none;border:0;color:var(--muted);font:700 12.5px var(--f-body);cursor:pointer;-webkit-tap-highlight-color:transparent}
.tabbar .ti{display:grid;place-items:center;width:54px;height:32px;border:2.5px solid transparent;border-radius:10px}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"] .ti{background:var(--accent);color:var(--on-tile);border-color:var(--edge);box-shadow:2px 2px 0 var(--shadow)}

/* ---------- cards, notices, pills ---------- */
.card{min-width:0;background:var(--surface);border:2.5px solid var(--edge);border-radius:14px;box-shadow:5px 5px 0 var(--shadow);padding:18px}
.card.flush{padding:0}
.card .hd{padding:18px 18px 8px}
.card h2{margin:0 0 4px;font:900 20px/1.15 var(--f-num);letter-spacing:-.01em;text-wrap:balance}
.card p{margin:0 0 10px;color:var(--muted);font-size:15px}
.card p:last-child{margin-bottom:0}
.pad{padding:4px 18px 18px}
.banner{display:grid;gap:8px;background:var(--t-sand);color:var(--on-tile);border:2.5px solid var(--edge);border-radius:14px;box-shadow:4px 4px 0 var(--shadow);padding:12px 14px;font-size:14.5px}
.banner p{margin:0}
.banner .btn{justify-self:start;min-height:40px;background:var(--paper);color:var(--on-tile)}
.msg{margin-top:12px;padding:10px 12px;border:2px solid var(--edge);border-radius:10px;background:var(--t-lilac);color:var(--on-tile);font-size:14px}
.msg.good{background:var(--t-mint)}
.msg.bad{background:var(--t-red)}
.pill{display:inline-block;padding:2px 9px;border:2px solid var(--edge);border-radius:99px;color:var(--on-tile);font:800 12px/1.35 var(--f-body);letter-spacing:.02em;white-space:nowrap;vertical-align:1px}
.pill.good{background:var(--t-mint)}
.pill.warn{background:var(--accent)}
.pill.bad{background:var(--t-red)}
.pill.acc{background:var(--t-lilac)}
.pill.off{background:var(--surface-2);color:var(--muted)}

/* ---------- forms and buttons ---------- */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.field{display:grid;gap:5px;min-width:0;align-content:start}
.field.wide{grid-column:1/-1}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;min-width:0;min-height:50px;padding:10px 12px;border:2px solid var(--edge);border-radius:10px;
  background:var(--surface);color:var(--ink);font:500 16px var(--f-body)}
input[type=number],input[type=date]{font-family:var(--f-num);font-variant-numeric:tabular-nums}
textarea{min-height:96px;font-size:14px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:3px 3px 0 var(--accent)}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:500;cursor:pointer}
.check input{width:24px;height:24px;margin:0;accent-color:var(--accent)}
.btn{min-height:50px;padding:0 18px;border:2.5px solid var(--edge);border-radius:12px;background:var(--accent);color:var(--on-tile);
  font:800 15px var(--f-body);box-shadow:3px 3px 0 var(--shadow);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.danger{background:var(--t-red);color:var(--on-tile)}
.btn.small{min-height:42px;padding:0 14px;border-radius:10px;font-size:14px;box-shadow:2px 2px 0 var(--shadow)}
.btn[disabled]{opacity:.45;box-shadow:none;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.filebtn{position:relative;display:inline-flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;width:100%;opacity:0;font-size:0;cursor:pointer}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.x{width:36px;height:36px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:22px;cursor:pointer}
.x.confirm{color:var(--bad);font-size:12px;font-weight:800}

/* ---------- the figure ---------- */
.hero{position:relative;background:var(--accent);color:var(--on-tile);border:2.5px solid var(--edge);border-radius:16px;box-shadow:7px 7px 0 var(--shadow);padding:22px 18px 16px}
.hero .eyebrow{margin:0;color:var(--on-tile)}
.hero .big{margin:10px 0 16px;font:900 clamp(58px,18vw,96px)/.92 var(--f-num);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.hpill{position:absolute;top:-16px;right:16px;padding:5px 10px;background:var(--t-mint);border:2.5px solid var(--edge);border-radius:10px;box-shadow:2px 2px 0 var(--edge);
  font:900 15px var(--f-num);white-space:nowrap;transform:rotate(2deg)}
.hpill.bad{background:var(--t-red);transform:rotate(-3deg)}
.gauge{position:relative;display:flex;height:24px;border:2.5px solid var(--on-tile);border-radius:8px;background:var(--paper)}
.gfill{height:100%}
.gfill.bills{background:var(--on-tile)}
.gfill.buf{background:repeating-linear-gradient(135deg,var(--on-tile) 0 3px,transparent 3px 8px)}
.gmark{position:absolute;top:-9px;bottom:-9px;width:8px;margin-left:-4px;border:2px solid var(--on-tile);border-radius:3px;background:var(--t-mint)}
.gmark.bad{background:var(--t-red)}
.glegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;padding:0;list-style:none;font-size:13.5px}
.glegend li{display:flex;align-items:center;gap:7px}
.glegend b{font:900 15px var(--f-num)}
.glegend i{flex:none;width:12px;height:12px;border:2px solid var(--on-tile);border-radius:3px}
.glegend .k-bills{background:var(--on-tile)}
.glegend .k-buf{background:repeating-linear-gradient(135deg,var(--on-tile) 0 2px,var(--paper) 2px 5px)}
.glegend .k-bal{background:var(--t-mint)}
.glegend .k-bal.bad{background:var(--t-red)}
.hint{margin:12px 0 0;font-weight:800;font-size:14.5px}
.hero .sub{margin:10px 0 0;max-width:52ch;opacity:.85;font-size:14.5px}
.hbal{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,170px);gap:2px 14px;align-items:center;margin-top:16px;padding-top:14px;border-top:2px solid var(--on-tile)}
.hbal small{font-size:13px;opacity:.8}
.money{grid-column:2;grid-row:1/3;position:relative}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font:800 17px var(--f-num);pointer-events:none}
.hbal input{padding-left:28px;border-color:var(--on-tile);background:var(--paper);color:var(--on-tile);font:800 18px var(--f-num)}
.hbal input:focus{box-shadow:3px 3px 0 var(--on-tile)}
.hbal input::placeholder{color:#7A7468;font:500 16px var(--f-body)}
.hbal input:placeholder-shown{padding-left:12px}
.hbal input:placeholder-shown+span{display:none}
.hbal input{appearance:textfield;-moz-appearance:textfield}
.hbal input::-webkit-outer-spin-button,.hbal input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.working{margin-top:14px;padding-top:10px;border-top:2px solid var(--on-tile)}
.working summary{font-weight:800;cursor:pointer;list-style:none}
.working summary::-webkit-details-marker{display:none}
.working summary::after{content:" ›"}
.working[open] summary::after{content:" ⌄"}
.working p{margin:8px 0;opacity:.85;font-size:13.5px}
.wlist{max-height:340px;margin:0;padding:0;overflow-y:auto;list-style:none;border:2px solid var(--on-tile);border-radius:10px;background:var(--paper);color:var(--on-tile);font-size:13px}
.wlist li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 10px;border-top:1px solid #CDC6B7;font-variant-numeric:tabular-nums}
.wlist li:first-child{border-top:0}
.wlist li span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.wlist li small{display:block;font:500 12px var(--f-num);opacity:.75}
.wlist li span:nth-child(3){font:600 13px var(--f-num);text-align:right;white-space:nowrap}
.wlist li.win,.wlist li.wstart{font-weight:600}
.wlist li.wlow{outline:2.5px solid var(--on-tile);outline-offset:-3px;border-radius:6px;background:#EFC6BA}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tiles.one{grid-template-columns:1fr}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-width:0;min-height:124px;padding:14px;text-align:left;color:var(--on-tile);font:inherit;cursor:pointer;
  border:2.5px solid var(--edge);border-radius:14px;box-shadow:5px 5px 0 var(--shadow);transition:transform .1s,box-shadow .1s}
.tile:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--shadow)}
.tile:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--shadow)}
.tile .tv{font:900 clamp(26px,8vw,34px)/1 var(--f-num);letter-spacing:-.02em;overflow-wrap:anywhere}
.tile .ts{font:600 13px/1.35 var(--f-body);opacity:.85}
.tile.wide{grid-column:1/-1;min-height:96px}
.tile[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:3px}
.tiles .tile:nth-child(3n+2){transform:rotate(.8deg)}
.tiles .tile:nth-child(3n+2):hover{transform:rotate(.8deg) translate(-2px,-2px)}
.c-blue{background:var(--t-blue)}.c-red{background:var(--t-red)}.c-mint{background:var(--t-mint)}.c-lilac{background:var(--t-lilac)}
.c-sand{background:var(--t-sand)}.c-white{background:var(--t-white)}.c-warn{background:var(--accent)}

/* ---------- cost by category ---------- */
.catlist{margin:8px 0 0;padding:0;list-style:none}
.catlist li{display:grid;grid-template-columns:auto minmax(0,1fr) 72px auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.catlist li:first-child{border-top:0}
.catlist .cn{min-width:0;overflow-wrap:anywhere}
.catlist .cbar{height:6px;overflow:hidden;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.catlist .cbar i{display:block;height:100%;background:var(--cc)}
.catlist .cv{min-width:64px;text-align:right;font:800 14px var(--f-num);font-variant-numeric:tabular-nums}
.catlist li.tot{border-top:1.5px solid var(--line);font-weight:700}

/* ---------- coming fortnights ---------- */
.cyc details{border-top:1.5px solid var(--line)}
.cyc summary{display:grid;gap:10px;padding:14px 18px;list-style:none;cursor:pointer}
.cyc summary::-webkit-details-marker{display:none}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;grid-template-areas:"date num chev" "meta meta meta" "pills pills pills";column-gap:12px;row-gap:3px;align-items:end}
.cdate{grid-area:date;font:900 17px var(--f-num)}
.cmeta{grid-area:meta;color:var(--muted);font-size:13px}
.cpills{grid-area:pills;display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.cnum{grid-area:num;text-align:right;white-space:nowrap;font:800 19px var(--f-num);font-variant-numeric:tabular-nums}
.cnum small{display:block}
.cnum.bad{color:var(--bad)}
.crow .chev{grid-area:chev;align-self:center}
.track{height:10px;overflow:hidden;border:2px solid var(--edge);border-radius:6px;background:var(--surface-2)}
.track i{display:block;height:100%;background:var(--ink)}
.items{margin:0;padding:0 18px 14px;list-style:none}
.items li{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.items.nod li{grid-template-columns:minmax(0,1fr) auto}
.items .d{padding-top:2px;color:var(--muted);font:500 12.5px var(--f-num)}
.items .n{min-width:0;overflow-wrap:anywhere}
.items .n .dot{margin-right:7px}
.items .n small{display:block;color:var(--muted);font-size:12px}
.items li:not(.pay) .n small{padding-left:17px}
.items .a{text-align:right;white-space:nowrap;font:800 14px var(--f-num);font-variant-numeric:tabular-nums}
.items li.tot{font-weight:700}
.items li.pay .a{color:var(--good)}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead h2{margin:0;text-align:center;font:900 22px var(--f-num)}
.calhead small{display:block;text-align:center}
.navb{flex:none;width:44px;height:44px;border:2px solid var(--edge);border-radius:10px;background:var(--surface);box-shadow:2px 2px 0 var(--shadow);color:var(--ink);font-size:20px;cursor:pointer}
.navb[disabled]{opacity:.35;box-shadow:none;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.wd{padding:2px 0;text-align:center}
.day{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;min-height:62px;padding:4px 4px 8px;overflow:hidden;
  border:2px solid var(--edge);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.day.blank{visibility:hidden}
.day.past{opacity:.35}
.day.today{background:var(--accent);color:var(--on-tile)}
.day.sel{box-shadow:3px 3px 0 var(--shadow);transform:translate(-1px,-1px)}
.day.pay::after{content:"";position:absolute;left:4px;right:4px;bottom:3px;height:5px;border-radius:3px;background:var(--ink)}
.day.today.pay::after{background:var(--on-tile)}
.dn{font:700 12px/1.4 var(--f-num)}
.day.low .dn{color:var(--bad)}
.day.today.low .dn{color:var(--on-tile);text-decoration:underline 2px}
.dots{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--cc)}
.dots b{font:600 9px var(--f-num);color:var(--muted)}
.damt{margin-top:auto;white-space:nowrap;color:var(--muted);font:500 10px var(--f-num)}
.day.today .damt,.day.today .dots b{color:var(--on-tile)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:14px 0 0;padding:0;list-style:none;color:var(--muted);font-size:12.5px}
.legend li{display:flex;align-items:center;gap:6px}
.legend .pb{width:14px;height:5px;border-radius:3px;background:var(--ink)}
.legend .lowk{color:var(--bad);font:700 12px var(--f-num)}

/* ---------- bills ---------- */
.filters{display:grid;gap:12px;min-width:0}
.fgroup{display:grid;gap:7px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:2px solid var(--edge);border-radius:99px;background:var(--surface);
  box-shadow:2px 2px 0 var(--shadow);color:var(--ink);font:700 14px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-tile)}
.chip span{font:600 11.5px var(--f-num);opacity:.7}
.blist{margin:0;padding:0;list-style:none}
.blist>li{border-top:1.5px solid var(--line)}
.blist>li:first-child{border-top:0}
.blist li.open{background:var(--surface-2)}
.blist li.off .bn,.blist li.off .bamt{opacity:.5}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr) auto 12px;gap:12px;align-items:center;width:100%;min-height:64px;padding:14px 18px;
  background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.brow .bn{display:block;overflow-wrap:anywhere;font-size:15.5px;font-weight:700}
.brow .bs{display:block;color:var(--muted);font-size:13px}
.brow .bamt{white-space:nowrap;font:800 15px var(--f-num);font-variant-numeric:tabular-nums}
.brow .bamt small{display:block;text-align:right;color:var(--muted);font:500 11.5px var(--f-num)}
.ghead{display:grid;gap:2px;padding:14px 18px 4px}
.gmeta{color:var(--muted);font-size:12.5px}
.blist.sub{margin:0 0 6px 18px;border-left:2px solid var(--line)}

<body>
<div class="wrap" id="app"></div>

<script>
/*LOGIC_START*/
const KEY='billbuffer.v1';
const SERVER_MODE=true;
const D=(y,m,d)=>Math.floor(Date.UTC(y,m,d)/864e5);
const ymd=n=>{const t=new Date(n*864e5);return [t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()];};
const daysInMonth=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();
const parseISO=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?D(+m[1],+m[2]-1,+m[3]):null;};
const toISO=n=>new Date(n*864e5).toISOString().slice(0,10);
const dow=n=>new Date(n*864e5).getUTCDay();
function today(){const t=new Date();return D(t.getFullYear(),t.getMonth(),t.getDate());}
function addMonths(n,k,dom){const [y,m,d]=ymd(n);const t=m+k;const yy=y+Math.floor(t/12),mm=((t%12)+12)%12;return D(yy,mm,Math.min(dom||d,daysInMonth(yy,mm)));}
const median=a=>{const s=a.slice().sort((x,y)=>x-y);const h=s.length>>1;return s.length%2?s[h]:(s[h-1]+s[h])/2;};

const CADS=[['weekly','Weekly'],['fortnightly','Every 2 weeks'],['monthly','Monthly'],['quarterly','Every 3 months'],['yearly','Yearly']];
const PER_YEAR={weekly:365.25/7,fortnightly:365.25/14,monthly:12,quarterly:4,yearly:1};
const DEFAULT_CATS=()=>[{id:'housing',name:'Housing',color:0},{id:'utilities',name:'Utilities',color:1},{id:'insurance',name:'Insurance',color:2},{id:'subs',name:'Subscriptions',color:3},{id:'other',name:'Other',color:4}];
function guessCategory(n){
  const s=String(n).toUpperCase();
  if(/RENT|MORTGAGE|STRATA|COUNCIL|RATES|HOME LOAN/.test(s))return 'housing';
  if(/ENERGY|ELECTRIC|\bGAS\b|WATER|ORIGIN|\bAGL\b|ALINTA|\bNBN\b|BROADBAND|TELSTRA|OPTUS|VODAFONE|INTERNET|MOBILE|PHONE|\bTPG\b|IINET|AMAYSIM|BELONG/.test(s))return 'utilities';
  if(/INSUR|MEDIBANK|BUPA|\bNIB\b|\bHCF\b|\bAHM\b|AAMI|NRMA|RACV|RACQ|ALLIANZ|BUDGET DIRECT|YOUI|SUNCORP|\bGIO\b|REGO|REGISTRATION/.test(s))return 'insurance';
  if(/NETFLIX|SPOTIFY|\bSTAN\b|DISNEY|AMAZON|APPLE|GOOGLE|YOUTUBE|BINGE|KAYO|FOXTEL|\bGYM\b|FITNESS|ANYTIME|PATREON|MICROSOFT|ADOBE|DROPBOX|PARAMOUNT/.test(s))return 'subs';
  return 'other';
}

const DEFAULT_PEOPLE=()=>[{id:'p1',name:'You',nextPayday:'',freq:'fortnightly',payIn:''},{id:'p2',name:'Partner',nextPayday:'',freq:'fortnightly',payIn:''}];
const FREQ={weekly:{label:'Weekly',days:7,per:365.25/7},fortnightly:{label:'Fortnightly',days:14,per:365.25/14},'4weekly':{label:'Every 4 weeks',days:28,per:365.25/28},monthly:{label:'Monthly',per:12}};
const freqFromDays=n=>+n===7?'weekly':+n===28?'4weekly':'fortnightly';
let S=null;
const defaults=()=>({v:2,example:false,settings:{buffer:200,balance:'',autoStrip:false},categories:DEFAULT_CATS(),people:DEFAULT_PEOPLE(),bills:[],hidden:[],notDup:[],txns:[],files:[],meta:{lastBackup:null,changed:null}});

/* ---------- CSV reading ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/,1)[0]||'';
  const cnt=ch=>first.split(ch).length-1;
  const delim=(cnt('\t')>cnt(',')&&cnt('\t')>cnt(';'))?'\t':(cnt(';')>cnt(',')?';':',');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===delim){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur);cur='';rows.push(row);row=[]; }
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function parseAmt(s){
  if(s==null)return null;let t=String(s).trim();if(!t)return null;let neg=false;
  if(/^\(.*\)$/.test(t)){neg=true;t=t.slice(1,-1);}
  if(/dr$/i.test(t)){neg=true;t=t.replace(/dr$/i,'');}
  t=t.replace(/cr$/i,'');
  if(/-$/.test(t)){neg=true;t=t.slice(0,-1);}
  t=t.replace(/[$,\s]/g,'');
  if(t[0]==='-'){neg=true;t=t.slice(1);} else if(t[0]==='+')t=t.slice(1);
  if(!/^\d+(\.\d+)?$/.test(t))return null;
  const v=parseFloat(t);return neg?-v:v;
}
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function valid(y,m,d){if(m<0||m>11||d<1||d>daysInMonth(y,m))return null;return D(y,m,d);}
function parseDate(s,order){
  s=String(s||'').trim();let m;
  if((m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/)))return valid(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;const a=+m[1],b=+m[2];return order==='mdy'?valid(y,a-1,b):valid(y,b-1,a);}
  if((m=s.match(/^(\d{1,2})[ -]([A-Za-z]{3})[A-Za-z]*[ ,-]+(\d{2,4})/))){const mo=MON[m[2].toLowerCase()];if(mo==null)return null;let y=+m[3];if(y<100)y+=2000;return valid(y,mo,+m[1]);}
  return null;
}
function detectOrder(vals){
  let dmy=false,mdy=false;
  vals.forEach(v=>{const m=String(v).trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-]\d{2,4}/);if(m){if(+m[1]>12)dmy=true;if(+m[2]>12)mdy=true;}});
  return (mdy&&!dmy)?'mdy':'dmy';
}
function extract(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>String(c).trim()));
  if(rows.length<2)return {err:'No rows found.'};
  const head=rows[0].map(c=>String(c).trim().toLowerCase());
  const hasHeader=!rows[0].some(c=>parseDate(c)!=null)&&head.some(c=>/date|desc|amount|debit|credit|narr|detail|balance/.test(c));
  const body=hasHeader?rows.slice(1):rows;
  const ci={};
  if(hasHeader){
    head.forEach((c,i)=>{
      if(/balance/.test(c))return;
      if(/date/.test(c)){if(ci.date==null||(/^value/.test(head[ci.date])&&!/^value/.test(c)))ci.date=i;return;}
      if(ci.debit==null&&/debit|withdraw|money out|paid out/.test(c))ci.debit=i;
      else if(ci.credit==null&&/credit|deposit|money in|paid in/.test(c))ci.credit=i;
      else if(ci.amount==null&&/amount|value/.test(c))ci.amount=i;
      else if(ci.desc==null&&/desc|detail|narr|payee|memo|particulars|reference/.test(c))ci.desc=i;
    });
  } else {
    const sample=body.slice(0,15);const n=rows[0].length;const stat=[];
    for(let j=0;j<n;j++){
      const vals=sample.map(r=>r[j]);
      stat.push({j,date:vals.filter(v=>parseDate(v)!=null).length/vals.length,num:vals.filter(v=>parseDate(v)==null&&parseAmt(v)!=null).length/vals.length,len:vals.reduce((a,v)=>a+String(v||'').length,0)/vals.length});
    }
    const dc=stat.filter(s=>s.date>=.8).sort((a,b)=>b.date-a.date)[0];
    if(dc)ci.date=dc.j;
    const nums=stat.filter(s=>s.num>=.8);
    if(nums.length)ci.amount=nums[0].j;
    const txt=stat.filter(s=>s.j!==ci.date&&!nums.includes(s)).sort((a,b)=>b.len-a.len)[0];
    if(txt)ci.desc=txt.j;
  }
  if(ci.date==null)return {err:"Couldn't find a date column."};
  if(ci.amount==null&&ci.debit==null)return {err:"Couldn't find an amount or debit column."};
  const order=detectOrder(body.map(r=>r[ci.date]));
  const parsed=[];
  body.forEach(r=>{
    const d=parseDate(r[ci.date],order);if(d==null)return;
    let desc=ci.desc!=null?String(r[ci.desc]||'').trim():'';
    if(!desc)desc=r.filter((c,i)=>i!==ci.date&&i!==ci.amount&&i!==ci.debit&&i!==ci.credit&&parseAmt(c)==null).join(' ').trim();
    let v=null;
    if(ci.debit!=null){const dv=parseAmt(r[ci.debit]);if(dv)v=-Math.abs(dv);else if(ci.credit!=null&&parseAmt(r[ci.credit]))v=Math.abs(parseAmt(r[ci.credit]));else v=0;}
    else v=parseAmt(r[ci.amount]);
    if(v==null)return;
    parsed.push({d,t:desc,v});
  });
  if(!parsed.length)return {err:'No dated rows could be read.'};
  const anyNeg=parsed.some(p=>p.v<0);
  const txns=parsed.filter(p=>anyNeg?p.v<0:p.v>0).map(p=>({d:p.d,t:p.t,a:Math.abs(p.v)}));
  if(!txns.length)return {err:'No payments out found.'};
  return {txns,unsigned:!anyNeg};
}
function mergeTxns(newT){
  const key=t=>t.d+'|'+t.a.toFixed(2)+'|'+t.t;
  const have={};S.txns.forEach(t=>{have[key(t)]=(have[key(t)]||0)+1;});
  const inc={};newT.forEach(t=>{(inc[key(t)]=inc[key(t)]||[]).push(t);});
  let added=0;
  for(const k in inc){const need=inc[k].length-(have[k]||0);for(let i=0;i<need;i++){S.txns.push(inc[k][i]);added++;}}
  return added;
}

/* ---------- finding recurring bills ---------- */
const STOP=new Set('VISA PURCHASE DEBIT DIRECT EFTPOS CARD AUS AU PAYMENT BPAY TRANSFER ONLINE INTERNET FROM TO VALUE DATE PTY LTD THE PAY REF RECEIPT AUTH PENDING EFT POS AUSTRALIA NSW VIC QLD WA SA TAS ACT NT MELBOURNE SYDNEY IN OSKO INTERNAL JAN FEB MAR APR MAY JUN JUL AUG SEP SEPT OCT NOV DEC MON TUE WED THU FRI SAT SUN'.split(' '));
const SKIP=/\b(SALARY|WAGES|PAYROLL|INTEREST|REFUND)\b|ROUND UP/;
/* The payee part of a bank description. Many banks write "Payee - Type - Receipt 123 ...",
   so only the part before the first " - " is used. Transfers to the same account number
   are grouped by that account, whatever the description says. */
function payeeHead(s){s=String(s);return s.includes(' - ')?s.split(' - ')[0]:s;}
function payeeKey(s){
  const m=String(s).match(/\bto\s+(\d{6})\s+(\d{5,10})\b/i);
  if(m)return 'ACCT '+m[1]+m[2];
  return norm(payeeHead(s));
}
function cleanName(s){
  const w=String(s).replace(/\.{2,}|…/g,' ').replace(/[^A-Za-z0-9&' ]+/g,' ').split(/\s+/).filter(x=>x&&!/\d/.test(x));
  return w.slice(0,5).join(' ').toUpperCase();
}
function norm(s){
  const w=String(s).toUpperCase().replace(/[^A-Z0-9 ]+/g,' ').split(/\s+/).filter(x=>x.length>1&&!/\d/.test(x)&&!STOP.has(x));
  return w.slice(0,3).join(' ');
}
const titleCase=s=>s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const monthKey=d=>{const [y,m]=ymd(d);return y*12+m;};
const ordn=n=>{const v=n%100;if(v>=11&&v<=13)return n+'th';return n+(({1:'st',2:'nd',3:'rd'})[n%10]||'th');};
function cadFromGap(med){return med<=9?'weekly':med<=17?'fortnightly':med<=45?'monthly':med<=120?'quarterly':'yearly';}
function mkSeries(arr){
  if(arr.length<2)return null;
  const gaps=[];for(let i=1;i<arr.length;i++){const x=arr[i].d-arr[i-1].d;if(x>0)gaps.push(x);}
  if(!gaps.length)return null;
  const med=median(gaps);let cad=null;
  if(med>=6&&med<=8)cad='weekly';else if(med>=12&&med<=16)cad='fortnightly';else if(med>=26&&med<=35)cad='monthly';
  if(!cad)return null;
  return {cad,ok:gaps.filter(x=>Math.abs(x-med)<=Math.max(2,med*.2)).length/gaps.length};
}
/* Turns a set of payments into a bill's numbers: amount (highest), timing, spread. */
function seriesFields(arr,cad){
  arr=arr.slice().sort((a,b)=>a.d-b.d);
  const amts=arr.map(t=>t.a),mx=Math.max(...amts),mn=Math.min(...amts),spread=mx>0?(mx-mn)/mx:0;
  if(!cad){const g=[];for(let i=1;i<arr.length;i++)if(arr[i].d>arr[i-1].d)g.push(arr[i].d-arr[i-1].d);cad=g.length?cadFromGap(median(g)):'monthly';}
  // Banks move debits a day or two around weekends. Use the earliest day a bill has actually
  // come out, so it is never counted after a payday it could land before.
  const last=arr[arr.length-1].d;let anchor=last;
  const step=cad==='weekly'?7:cad==='fortnightly'?14:0;
  // Only a day or two earlier than the usual day counts; one-off late or early payments are ignored.
  const earliest=(vals)=>{const m=Math.round(median(vals)),need=Math.max(1,Math.ceil(vals.length*.25));
    return Math.min(m,...vals.filter(v=>v>=m-2&&v<=m&&vals.filter(x=>x===v).length>=need));};
  if(step){const offs=arr.map(t=>{let o=((t.d-last)%step+step)%step;if(o>step/2)o-=step;return o;});anchor=last+earliest(offs);}
  const doms=arr.map(t=>ymd(t.d)[2]);

/* ---------- one shared copy on the household server ----------
   The hosted app keeps no copy of the bills on the device. Everything is read from and saved
   straight to the server, so every device works on the same version. If someone else saves
   first, the save is refused and the latest version is shown instead of overwriting it.
   With a passcode set on the server, each device signs in once and gets its own token. */
var Sync={open:false,lock:null,mode:SERVER_MODE?'loading':'local',status:'',timer:null,poll:null,lastOk:null,busy:false,gen:0,dirty:false,signinErr:'',confirmAll:false,notice:'',down:false};
const SKEY='billbuffer.sync';
/* A device's sign-in is kept for good (localStorage), or only until the app is closed (sessionStorage)
   when "Keep this device signed in" was unticked. */
let SY=(()=>{let o={},t;try{o=JSON.parse(localStorage.getItem(SKEY))||{};}catch(e){}
  if(!o.token){try{t=sessionStorage.getItem(SKEY+'.token')||undefined;}catch(e){}}
  return {token:o.token||t,device:o.device,remember:!t};})();
let serverVersion=0;
function sySave(){
  const keep=SY.remember!==false;
  try{localStorage.setItem(SKEY,JSON.stringify({token:keep?SY.token:undefined,device:SY.device}));}catch(e){}
  try{if(!keep&&SY.token)sessionStorage.setItem(SKEY+'.token',SY.token);else sessionStorage.removeItem(SKEY+'.token');}catch(e){}
}

async function api(method,path,body){

  if(SY.token)hd.Authorization='Bearer '+SY.token;

  let j=null;try{j=await r.json();}catch(e){}
  return {status:r.status,data:j};

function canApplyRemote(){const a=document.activeElement;return !editing&&!editingP&&!pendingRestore&&!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));}
function syncChip(){

async function loadFromServer(){

function queuePush(){
  if(Sync.mode!=='on')return;
  Sync.gen++;Sync.dirty=true;clearTimeout(Sync.timer);Sync.timer=setTimeout(pushNow,350);setSyncStatus('saving');
}
async function pushNow(){
  clearTimeout(Sync.timer);Sync.timer=null;
  if(Sync.mode!=='on'||!Sync.dirty)return;
  if(Sync.busy){Sync.timer=setTimeout(pushNow,300);return;}
  Sync.busy=true;const gen=Sync.gen;
  try{
    const r=await api('PUT','state',{base:serverVersion,state:S});
    if(r.status===200){
      serverVersion=r.data.version;Sync.lastOk=Date.now();Sync.down=false;
      if(Sync.gen===gen){Sync.dirty=false;setSyncStatus('synced');}else Sync.timer=setTimeout(pushNow,100);
    } else if(r.status===409){
      const who=r.data&&r.data.updatedBy?r.data.updatedBy:'Someone else';
      takeServer(r.data);editing=null;editingP=null;
      Sync.notice=`${who} saved a change just before you, so your last change wasn't saved. This is the latest version. Please make your change again.`;
      setSyncStatus('synced');render();
    } else if(r.status===401){Sync.busy=false;return signedOut();}
    else throw 0;
  }catch(e){
    Sync.dirty=false;Sync.down=true;
    Sync.notice="Your last change wasn't saved because the server can't be reached. The latest version will load when it's back.";
    setSyncStatus('offline');render();
  }
  Sync.busy=false;
}
async function pullNow(){
  if(Sync.mode!=='on'||Sync.busy||Sync.dirty)return;
  try{
    const wasDown=Sync.down;
    const r=await api('GET',wasDown?'state':'state?since='+serverVersion);
    if(r.status===401)return signedOut();
    if(r.status!==200)throw 0;
    Sync.down=false;Sync.lastOk=Date.now();
    if(r.data.unchanged){setSyncStatus('synced');if(wasDown)render();return;}
    if(canApplyRemote()||wasDown){takeServer(r.data);setSyncStatus('synced');render();}
  }catch(e){if(!Sync.down){Sync.down=true;setSyncStatus('offline');render();}}
}
function startPolling(){stopPolling();Sync.poll=setInterval(()=>{if(document.visibilityState==='visible')pullNow();},15000);}

async function boot(){

  if(!st||st.app!=='bill-buffer'){Sync.mode='on';Sync.down=true;Sync.status='offline';startPolling();render();return;}
  if(!st.ready){Sync.mode='nopass';render();return;}
  Sync.open=!!st.open;Sync.lock=st.lock||null;
  if(Sync.open){if(!SY.device){SY.device=guessDevice();sySave();}}

async function doSignin(){
  const pass=$('#si-pass').value,device=($('#si-dev').value||'').trim()||guessDevice(),remember=$('#si-keep').checked;
  if(!pass){Sync.signinErr='Enter the household passcode.';render();return;}
  let r;
  try{r=await api('POST','login',{passcode:pass,device});}catch(e){Sync.signinErr="Can't reach the server. Check you're on your home network.";render();return;}
  if(r.status===200&&r.data&&r.data.token){
    SY={token:r.data.token,device,remember};sySave();
    Sync.signinErr='';Sync.mode='on';startPolling();await loadFromServer();return;
  }
  if(r.status===429){const m=Math.max(1,Math.ceil(((r.data&&r.data.retryAfter)||900)/60));Sync.signinErr=`Too many wrong tries. Try again in ${plural(m,'minute')}.`;}
  else if(r.status===401){const n=r.data&&r.data.triesLeft;Sync.signinErr=`That passcode isn't right.${n>0?` ${plural(n,'try','tries')} left before a 15 minute lockout.`:''}`;}
  else if(r.status===503){Sync.mode='nopass';}
  else if(r.status===400){Sync.mode='on';Sync.open=true;startPolling();await loadFromServer();return;}
  else Sync.signinErr='Sign-in failed. Try again.';
  render();
}

async function passcodeSubmit(id){
  const v=x=>{const e=$(x);return e?e.value:'';};
  const where=id==='pcOn'?'passcode':id==='pcChange'?'pcchange':'pcoff';
  const fail=t=>{setMsg(where,t,'bad');render();};
  let body;
  if(id==='pcOff'){if(!v('#pc-off'))return fail('Enter the current passcode.');body={current:v('#pc-off'),new:''};}
  else{
    const n=v('#pc-new');
    if(id==='pcChange'&&!v('#pc-cur'))return fail('Enter the current passcode.');
    if(n.length<8)return fail('Use at least 8 characters.');
    if(n!==v('#pc-new2'))return fail("The two new passcodes don't match.");
    body={current:v('#pc-cur'),new:n};
  }
  let r;try{r=await api('POST','passcode',body);}catch(e){return fail("Can't reach the server. Try again.");}
  if(r.status===200){
    if(r.data.on){SY.token=r.data.token;sySave();Sync.open=false;Sync.lock='app';
      setMsg('passcode',id==='pcOn'?'Passcode on. Other devices will ask for it.':'Passcode changed. Other devices will need the new one.','good');}
    else{SY.token=undefined;sySave();Sync.open=true;Sync.lock=null;setMsg('passcode','Passcode off. Anyone on your home network can open the app.','good');}
    return render();
  }
  const d=r.data||{};
  if(r.status===401&&d.error==='wrong_passcode')return fail(`That passcode isn't right.${d.triesLeft>0?` ${plural(d.triesLeft,'try','tries')} left before a 15 minute lockout.`:''}`);
  if(r.status===429)return fail(`Too many wrong tries. Try again in ${plural(Math.max(1,Math.ceil((d.retryAfter||900)/60)),'minute')}.`);
  if(r.status===401)return signedOut();
  if(r.status===409){Sync.open=false;Sync.lock='server';return fail('The passcode is set in the container (BB_PASSCODE), so change it there.');}
  if(r.status===400&&d.error==='bad_length')return fail('Use at least 8 characters.');
  fail("The passcode couldn't be changed. Try again.");
}

/* ---------- actions ---------- */
function stripStatements(){
  S.bills.forEach(b=>{if(b.src==='auto')b.locked=true;b.txs=[];});
  S.txns=[];S.files=[];
}
function clearExampleData(){S.example=false;S.txns=[];S.bills=[];S.files=[];S.hidden=[];S.notDup=[];S.people=DEFAULT_PEOPLE();}
async function importTexts(items){
  const results=[];const errs=[];
  items.forEach(it=>{const r=extract(it.text);if(r.err)errs.push(`${it.name}: ${r.err}`);else results.push({it,r});});
  if(results.length&&S.example)clearExampleData();
  let total=0;
  results.forEach(({it,r})=>{
    const added=mergeTxns(r.txns);total+=added;const ds=r.txns.map(t=>t.d);
    S.files.push({name:it.name,from:Math.min(...ds),to:Math.max(...ds),rows:r.txns.length,added});
  });
  if(results.length){redetect();if(S.settings.autoStrip)stripStatements();persist();}
  const found=S.bills.filter(b=>b.src==='auto').length;
  const parts=[];
  if(results.length)parts.push(`Added ${plural(total,'payment')}. ${plural(found,'recurring bill')} found. Check them on the Bills tab.${S.settings.autoStrip?' The statement details were removed afterwards.':''}`);
  if(results.some(x=>x.r.unsigned))parts.push('This file shows every amount as positive, so all rows were treated as payments out. Turn off anything that is not a bill.');
  if(errs.length)parts.push(errs.join(' '));
  setMsg('import',parts.join(' '),errs.length&&!results.length?'bad':'good');
  render();
}
function newCategory(name){
  name=name.trim().slice(0,40);if(!name)return null;
  const ex=S.categories.find(c=>c.name.toLowerCase()===name.toLowerCase());if(ex)return ex.id;
  const usedC=new Set(S.categories.map(c=>c.color));let color=0;while(usedC.has(color)&&color<8)color++;if(color>=8)color=S.categories.length%8;
  const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  S.categories.push({id,name,color});return id;
}
function formError(text){

function savePerson(){

  if(editingP==='new'){
    const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    S.people.push(Object.assign({id},fields));
  } else {const x=S.people.find(q=>q.id===editingP);if(x)Object.assign(x,fields);}
  editingP=null;msg=null;persist();render();
}
function saveBill(){
  const name=$('#e-name').value.trim(),amt=parseFloat($('#e-amt').value),cad=$('#e-cad').value,date=$('#e-date').value,inc=$('#e-inc').checked;
  let cat=$('#e-cat').value;
  if(!name||!(amt>=0)||parseISO(date)==null){formError('Enter a name, an amount and the next due date.');return;}
  if(cat==='__new'){cat=newCategory($('#e-newcat').value);if(!cat){formError('Type a name for the new category.');return;}}
  const owner=$('#e-own').value;
  if(!S.people.some(x=>x.id===owner)){formError('Choose who pays this bill.');return;}
  const fields={owner,changes:editChanges.map(c=>({...c})),name,amount:Math.round(amt*100)/100,cadence:cad,anchor:date,dom:ymd(parseISO(date))[2],category:cat,include:inc,locked:true};
  if(editing!=='new'){const b0=S.bills.find(x=>x.id===editing);if(b0){const nd0=nextDue(b0,today());
    if(cad===b0.cadence&&nd0!=null&&date===toISO(nd0)){delete fields.anchor;delete fields.dom;}else fields.userDates=true;}}
  else fields.userDates=true;
  if(editing==='new'){
    if(S.example)clearExampleData();
    S.bills.push(Object.assign({id:'m:'+Date.now().toString(36),src:'manual'},fields));
    setMsg('bills',`Added ${name}.`,'good');
  } else {
    const b=S.bills.find(x=>x.id===editing);if(b)Object.assign(b,fields);
    setMsg('bills',`Saved ${name}.`,'good');
  }
  editing=null;confirmDel=null;editChangesFor=null;persist();render();
}
function splitTx(){
  const b=S.bills.find(x=>x.id===editing);if(!b||!Array.isArray(b.txs))return;
  const ticked=new Set([...document.querySelectorAll('[data-tx]:checked')].map(i=>i.dataset.tx));
  if(!ticked.size){formError('Tick at least one payment to split off.');return;}
  const moved=b.txs.filter(x=>ticked.has(x.d+'|'+x.a)),left=b.txs.filter(x=>!ticked.has(x.d+'|'+x.a));
  if(!left.length){formError('Leave at least one payment on this bill.');return;}
  const keepInc=b.include;
  Object.assign(b,seriesFields(left,left.length>=2?null:b.cadence),{locked:true,total:false,grp:grpOf(b)||b.grp,include:keepInc});
  const nb=Object.assign({id:'m:'+Date.now().toString(36),src:'manual',grp:b.grp,name:b.name+' (split)',owner:b.owner,category:b.category,include:true,locked:true},
    seriesFields(moved,moved.length>=2?null:b.cadence));
  S.bills.push(nb);editing=nb.id;confirmDel=null;persist();
  setMsg('editor',`Split ${plural(moved.length,'payment')} into this new bill. Give it a name and check the details, then save.`,'good');render();
  const n=$('#e-name');if(n){n.focus();n.select();}
}
function recheck(){
  const b=S.bills.find(x=>x.id===editing);if(!b)return;const g=grpOf(b);if(!g)return;
  const inherit={category:b.category},ownersById=new Map(S.bills.filter(x=>grpOf(x)===g).map(x=>[x.id,x.owner]));
  S.bills=S.bills.filter(x=>grpOf(x)!==g);
  S.hidden=S.hidden.filter(id=>!(id==='d:'+g||id.startsWith('d:'+g+'|')));
  redetect();
  const now=S.bills.filter(x=>grpOf(x)===g);
  now.forEach(x=>{if(!x.owner&&ownersById.get(x.id))x.owner=ownersById.get(x.id);x.category=inherit.category;});
  editing=null;confirmRecheck=null;persist();
  setMsg('bills',now.length?`Re-checked: found ${plural(now.length,'bill')} for this payee.`:'Re-checked: no regular bill found for this payee.','good');render();
}
function deleteBill(id){
  const b=S.bills.find(x=>x.id===id);if(!b)return;
  if(b.src==='auto'&&!S.hidden.includes(id))S.hidden.push(id);
  S.bills=S.bills.filter(x=>x.id!==id);
  S.notDup=S.notDup.filter(k=>!k.split('~').includes(id));
  if(editing===id)editing=null;confirmDel=null;
  persist();setMsg('bills',`Deleted ${b.name}.`,'good');render();
}
async function saveBackupFile(name,data){
  if(dl){await dl.save({filename:name,data});return;}
  const file=new File([data],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Bill Buffer backup'});return;}
    catch(e){if(e&&e.name==='AbortError')throw {code:'declined'};}
  }
  const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
async function doBackup(){
  try{
    const payload={app:'bill-buffer',version:2,exportedAt:new Date().toISOString(),state:S};
    await saveBackupFile(`bill-buffer-backup-${toISO(today())}.json`,JSON.stringify(payload,null,1));
    S.meta.lastBackup=new Date().toISOString();persist(false);
    setMsg('backup','Backup done. Check that it landed in Drive.','good');
  }catch(e){
    setMsg('backup',e&&e.code==='declined'?'Backup cancelled.':'Could not save the backup'+(e&&e.message?': '+e.message:'.'),'bad');
  }
  render();
}
async function onRestoreFile(file){
  try{
    const o=JSON.parse(await file.text());
    if(!o||o.app!=='bill-buffer'||!o.state||!Array.isArray(o.state.bills)||!Array.isArray(o.state.txns))throw new Error('not a backup');
    pendingRestore={name:file.name,state:o.state,exportedAt:o.exportedAt};msg=null;
  }catch(e){pendingRestore=null;setMsg('restore',"That file isn't a Bill Buffer backup.",'bad');}
  render();
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a!=='reset'&&a!=='stripNow')confirmReset=null;
  if(a!=='signOutAll')Sync.confirmAll=false;
  if(a!=='recheck')confirmRecheck=null;
  if(a!=='delBill')confirmDel=null;
  if(a!=='catDel')confirmCat=null;
  if(a!=='pdel')confirmPerson=null;
  if(a==='tab'){if(el.dataset.tab==='settings')setSec='';tab=el.dataset.tab;msg=null;pendingRestore=null;editing=null;editingP=null;render();window.scrollTo(0,0);}
  else if(a==='ownerBills'){tab='bills';ownFilter=el.dataset.id;catFilter='all';editing=null;msg=null;render();window.scrollTo(0,0);}
  else if(a==='setSec'){setSec=el.dataset.sec;editingP=null;msg=null;pendingRestore=null;confirmReset=null;render();window.scrollTo(0,0);}
  else if(a==='showWorking'){openWorking=true;tab='now';render();const w=$('.working');if(w)w.scrollIntoView({block:'center'});}
  else if(a==='clearExample'){clearExampleData();persist();render();}
  else if(a==='edit'){const id=el.dataset.id;editing=editing===id?null:id;msg=null;render();}
  else if(a==='new'){editing='new';msg=null;render();const n=$('#e-name');if(n)n.focus();}
  else if(a==='cancelEdit'){editing=null;editChangesFor=null;msg=null;render();}
  else if(a==='saveBill')saveBill();
  else if(a==='chAdd'){
    const am=parseFloat($('#c-amt').value),fr=$('#c-from').value,un=$('#c-until').value;
    const err=m=>{const x=$('#e-chmsg');if(x)x.innerHTML=`<div class="msg bad" role="status">${esc(m)}</div>`;};
    if(!(am>=0))return err('Enter the new amount.');
    if(parseISO(fr)==null)return err('Enter the date the change starts.');
    if(un&&parseISO(un)<parseISO(fr))return err('The end date is before the start date.');
    if(un&&parseISO(un)<today())return err('That end date has already passed.');
    editChanges.push({id:'c'+Date.now().toString(36),amount:Math.round(am*100)/100,from:fr,until:un||null});
    $('#e-chlist').innerHTML=changesListHtml();$('#c-amt').value='';$('#c-until').value='';$('#e-chmsg').innerHTML='';
  }
  else if(a==='chDel'){editChanges=editChanges.filter(c=>c.id!==el.dataset.id);const l=$('#e-chlist');if(l)l.innerHTML=changesListHtml();}
  else if(a==='dismissNotice'){Sync.notice='';render();}
  else if(a==='retry'){if(serverVersion===0&&!Sync.lastOk){Sync.mode='loading';render();boot();}else pullNow();}
  else if(a==='signOut'){try{await api('POST','logout',{});}catch(e){}signedOut();}
  else if(a==='signOutAll'){if(!Sync.confirmAll){Sync.confirmAll=true;render();return;}try{await api('POST','logout-all',{});}catch(e){}Sync.confirmAll=false;signedOut();}
  else if(a==='splitTx')splitTx();
  else if(a==='recheck'){if(confirmRecheck!==editing){confirmRecheck=editing;render();}else recheck();}
  else if(a==='delBill'){const id=el.dataset.id;if(confirmDel===id)deleteBill(id);else{confirmDel=id;render();}}
  else if(a==='dupKeep'){if(!S.notDup.includes(el.dataset.key))S.notDup.push(el.dataset.key);persist();render();}
  else if(a==='filter'){catFilter=el.dataset.cat;editing=null;render();}
  else if(a==='showUnassigned'){tab='bills';ownFilter='none';catFilter='all';editing=null;msg=null;render();}
  else if(a==='ofilter'){ownFilter=el.dataset.own;editing=null;render();}
  else if(a==='pedit'){const id=el.dataset.id;editingP=editingP===id?null:id;msg=null;render();}
  else if(a==='pnew'){editingP='new';msg=null;render();const n=$('#p-name');if(n)n.focus();}
  else if(a==='pcancel'){editingP=null;msg=null;render();}
  else if(a==='psave')savePerson();
  else if(a==='pdel'){
    const id=el.dataset.id;
    if(confirmPerson!==id){confirmPerson=id;render();return;}
    S.bills.forEach(b=>{if(b.owner===id)b.owner='';});
    S.people=S.people.filter(x=>x.id!==id);confirmPerson=null;editingP=null;
    if(ownFilter===id)ownFilter='all';persist();render();
  }
  else if(a==='catColor'){const c=S.categories.find(x=>x.id===el.dataset.id);if(c){c.color=(c.color+1)%8;persist();render();}}
  else if(a==='catAdd'){const v=$('#newCat').value;if(newCategory(v)){persist();render();}}
  else if(a==='catDel'){
    const id=el.dataset.id;
    if(confirmCat!==id){confirmCat=id;render();return;}
    S.bills.forEach(b=>{if(b.category===id)b.category='other';});
    S.categories=S.categories.filter(c=>c.id!==id);confirmCat=null;if(catFilter===id)catFilter='all';persist();render();
  }
  else if(a==='unhide'){S.hidden=[];redetect();persist();setMsg('import','Deleted bills brought back.','good');render();}
  else if(a==='day'){selDay=+el.dataset.d;render();}
  else if(a==='calPrev'||a==='calNext'){const k=calY*12+calM+(a==='calNext'?1:-1);calY=Math.floor(k/12);calM=k%12;
    const t=today();const [ty,tm]=ymd(t);selDay=(calY===ty&&calM===tm)?t:D(calY,calM,1);render();}
  else if(a==='pasteImport'){const v=$('#pasteBox').value;if(!v.trim()){setMsg('import','Paste some rows first.','bad');render();return;}await importTexts([{name:'Pasted rows',text:v}]);}
  else if(a==='backup')doBackup();
  else if(a==='restoreNo'){pendingRestore=null;render();}
  else if(a==='restoreYes'&&pendingRestore){
    S=cleanState(pendingRestore.state,false);
    S.meta.lastBackup=pendingRestore.exportedAt||null;S.meta.changed=Date.now()-5000;persist(false);queuePush();
    pendingRestore=null;editing=null;setMsg('restore','Backup restored.','good');render();
  }
  else if(a==='stripNow'){
    if(confirmReset!=='strip'){confirmReset='strip';render();return;}
    confirmReset=null;stripStatements();persist();setMsg('strip','Statement details removed. Your bills are unchanged.','good');render();
  }
  else if(a==='reset'){
    const k=el.dataset.kind;
    if(confirmReset!==k){confirmReset=k;clearTimeout(clearTimer);clearTimer=setTimeout(()=>{confirmReset=null;if(tab==='settings')render();},5000);render();return;}
    confirmReset=null;editing=null;editingP=null;catFilter='all';ownFilter='all';openSeg.clear();calY=null;
    const keepMeta=S.meta;
    if(k==='statements'){S.txns=[];S.files=[];S.hidden=[];S.bills=S.bills.filter(b=>b.src!=='auto'||b.locked);S.example=false;setMsg('reset','Statements cleared. Your own and edited bills are still there.','good');}
    else if(k==='bills'){S.txns=[];S.files=[];S.hidden=[];S.notDup=[];S.bills=[];S.example=false;setMsg('reset','All bills cleared.','good');}
    else if(k==='all'){S=defaults();S.meta=keepMeta;setMsg('reset','Everything cleared. Add your people under People and paydays to start.','good');}
    else if(k==='example'){S=buildExample();S.meta=keepMeta;setMsg('reset','Example loaded.','good');}
    persist();render();
  }
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.s){
    setSetting(el);
  } else if(el.dataset.cat&&el.tagName==='INPUT'){
    const c=S.categories.find(x=>x.id===el.dataset.cat);if(!c)return;
    const v=el.value.trim().slice(0,40);if(v){c.name=v;persist();}else el.value=c.name;
  } else if(el.dataset.qown){
    const b=S.bills.find(x=>x.id===el.dataset.qown);
    if(b&&S.people.some(x=>x.id===el.value)){b.owner=el.value;b.locked=true;persist();setMsg('bills',`${b.name} is now paid by ${ownerName(b.owner)}.`,'good');render();}
  } else if(el.id==='autoStrip'){
    S.settings.autoStrip=el.checked;persist();
  } else if(el.id==='e-cat'){
    const w=$('#e-newwrap');if(w){w.hidden=el.value!=='__new';if(!w.hidden)$('#e-newcat').focus();}
  } else if(el.id==='fileCsv'){
    const files=Array.from(el.files||[]);if(!files.length)return;
    const items=[];for(const f of files)items.push({name:f.name,text:await f.text()});
    el.value='';await importTexts(items);
  } else if(el.id==='fileRestore'){
    const f=el.files&&el.files[0];el.value='';if(f)await onRestoreFile(f);
  }
});
/* Balance and buffer update the figure as you type (after a short pause), not only when you leave the box. */
function setSetting(el){
  const k=el.dataset.s,v=el.value===''?'':+el.value;
  if(S.settings[k]===v||(v!==''&&!isFinite(v)))return;
  S.settings[k]=v;persist();refreshNow();
}
let typingTimer=null;
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.s)return;clearTimeout(typingTimer);typingTimer=setTimeout(()=>setSetting(el),300);});
document.addEventListener('submit',e=>{const id=e.target&&e.target.id;if(!id)return;
  if(id==='signinForm'){e.preventDefault();doSignin();}
  else if(/^pc(On|Change|Off)$/.test(id)){e.preventDefault();passcodeSubmit(id);}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='newCat'){e.preventDefault();if(newCategory(e.target.value)){persist();render();}}});
document.addEventListener('toggle',e=>{const d=e.target;if(!d||!d.dataset)return;if(d.classList&&d.classList.contains('working'))openWorking=d.open;if(d.dataset.i!=null){const i=+d.dataset.i;if(d.open)openSeg.add(i);else openSeg.delete(i);}},true);

let wasWide=isWide();window.addEventListener('resize',()=>{const w=isWide();if(w!==wasWide){wasWide=w;render();}});
boot();
(async()=>{try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){dl=null;}})();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
