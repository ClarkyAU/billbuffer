<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bill Buffer</title>
<meta name="theme-color" content="#0A0F15">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:'Archivo';src:url(fonts/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:swap}
@font-face{font-family:'Onest';src:url(fonts/onest.woff2) format('woff2');font-weight:100 900;font-stretch:100%;font-style:normal;font-display:swap}

/* Layout: one phone column with a bottom tab bar. The account is drawn as a level: bills, then the
   buffer on top, with your balance marked against it. Marigold is reserved for the buffer and actions. */
:root{
  color-scheme:light;
  --bg:#E8ECF1; --surface:#FFFFFF; --surface-2:#F3F5F8; --line:#D3DAE3; --ink:#0D1622; --muted:#566476;
  --accent:#E8A317; --accent-text:#7E5200; --accent-ink:#1B1200; --accent-soft:#FBEBC6;
  --good:#0E7A58; --good-soft:#D2F0E4; --warn:#9C4A00; --warn-soft:#FCE4CF; --bad:#C3262F; --bad-soft:#FADADC; --on-bad:#FFFFFF; --level:#24334A;
  --k0:#D9480F; --k1:#0B7F8A; --k2:#7048E8; --k3:#C2255C; --k4:#6B7684; --k5:#A87000; --k6:#2B8A3E; --k7:#1C63D6;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F15; --surface:#121922; --surface-2:#19222E; --line:#253142; --ink:#EAF0F7; --muted:#8B99AC;
    --accent:#F5B841; --accent-text:#F5B841; --accent-ink:#1A1300; --accent-soft:#3A2C0E;
    --good:#4CD4A3; --good-soft:#10332A; --warn:#FFA15C; --warn-soft:#3A2414; --bad:#FF6B70; --bad-soft:#43191C; --on-bad:#1F0507; --level:#7F93AD;
    --k0:#FF8A4C; --k1:#3CCFD9; --k2:#A58BFF; --k3:#FF6FA0; --k4:#9AA6B5; --k5:#F2C94C; --k6:#5FD27E; --k7:#6EA8FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F15; --surface:#121922; --surface-2:#19222E; --line:#253142; --ink:#EAF0F7; --muted:#8B99AC;
  --accent:#F5B841; --accent-text:#F5B841; --accent-ink:#1A1300; --accent-soft:#3A2C0E;
  --good:#4CD4A3; --good-soft:#10332A; --warn:#FFA15C; --warn-soft:#3A2414; --bad:#FF6B70; --bad-soft:#43191C; --on-bad:#1F0507; --level:#7F93AD;
  --k0:#FF8A4C; --k1:#3CCFD9; --k2:#A58BFF; --k3:#FF6FA0; --k4:#9AA6B5; --k5:#F2C94C; --k6:#5FD27E; --k7:#6EA8FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font:15px/1.45 var(--f-body); margin:0;
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:14px}
h1{font:700 22px/1.1 var(--f-body);letter-spacing:-.01em;margin:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top small{color:var(--muted);font:500 12px var(--f-num)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tab{font:600 13.5px var(--f-body);color:var(--muted);background:none;border:0;border-radius:7px;min-height:40px;padding:0 2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card.flush{padding:0}
.card .hd{padding:16px 16px 6px}
.card h2{font:700 16px/1.25 var(--f-body);margin:0 0 4px;text-wrap:balance}
.card p{margin:0 0 10px;color:var(--muted)}
.card p:last-child{margin-bottom:0}
.eyebrow{font:600 11px var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:20px 18px}
.hero .eyebrow{color:inherit;opacity:.85;margin:0}
.hero .big{font:600 clamp(40px,13vw,56px)/1.05 var(--f-num);letter-spacing:-.03em;margin:8px 0 10px;font-variant-numeric:tabular-nums}
.hero .sub{margin:0;opacity:.92;max-width:46ch}
.hero .rows{margin-top:16px;border-top:1px solid color-mix(in srgb,var(--accent-ink) 30%,transparent)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.hrow:last-child{border-bottom:0;padding-bottom:0}
.hrow .l{min-width:0}
.hrow .l small{display:block;opacity:.8;font-size:12px}
.hrow .v{font:600 18px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.hpill{font:600 11px var(--f-num);letter-spacing:.06em;text-transform:uppercase;background:var(--accent-ink);color:var(--accent);padding:4px 8px;border-radius:99px;white-space:nowrap}
.working{margin-top:14px;border-top:1px solid color-mix(in srgb,var(--accent-ink) 30%,transparent);padding-top:10px}
.working summary{cursor:pointer;font-weight:600;list-style:none}
.working summary::-webkit-details-marker{display:none}
.working summary::after{content:" ›";opacity:.8}
.working[open] summary::after{content:" ⌄"}
.working p{margin:8px 0;font-size:13.5px;opacity:.92}
.wlist{list-style:none;margin:0;padding:0;font-size:13px;max-height:340px;overflow-y:auto;border-radius:8px;background:color-mix(in srgb,var(--accent-ink) 10%,transparent)}
.wlist li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 10px;border-top:1px solid color-mix(in srgb,var(--accent-ink) 14%,transparent);font-variant-numeric:tabular-nums}
.wlist li:first-child{border-top:0}
.wlist li span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.wlist li small{display:block;font:500 12px var(--f-num);opacity:.85}
.wlist li span:nth-child(3){font-family:var(--f-num);font-weight:600;text-align:right;white-space:nowrap}
.wlist li.win{font-weight:600}
.wlist li.wstart{font-weight:600}
.wlist li.wlow{outline:2px solid var(--accent-ink);outline-offset:-2px;border-radius:6px}
.hbtn{width:100%;background:none;border:0;border-bottom:1px solid color-mix(in srgb,var(--accent-ink) 22%,transparent);color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:0}
.hbtn:last-child{border-bottom:0}
.hbtn:hover .l{text-decoration:underline}
.harrow{font:400 22px/1 var(--f-body);margin-left:8px;opacity:.8;vertical-align:-1px}
.hpill.bad{background:var(--bad);color:var(--surface);font-size:12px;padding:5px 10px}

.pill{display:inline-block;font:600 10.5px var(--f-num);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;vertical-align:1px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.off{background:var(--line);color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.banner p{margin:0}
.banner .btn{justify-self:start;background:none;color:var(--warn);border-color:var(--warn)}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.field{display:grid;gap:4px;min-width:0;align-content:start}
.field.wide{grid-column:1/-1}
.field label,.flabel{font:600 11px var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;min-width:0;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);font:16px var(--f-num);
}
textarea{font-size:14px;min-height:96px;resize:vertical}
input[type=text],select{font-family:var(--f-body)}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:500;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:600 15px var(--f-body);cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.filebtn{position:relative;display:inline-flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;font-size:0}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px;background:var(--accent-soft);color:var(--ink)}
.msg.good{background:var(--good-soft);color:var(--good)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cc,var(--k4));flex:none}
.n .dot{margin-right:7px;vertical-align:0}

/* category split */
.catlist{list-style:none;margin:8px 0 0;padding:0}
.catlist li{display:grid;grid-template-columns:auto minmax(0,1fr) 72px auto;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.catlist li:first-child{border-top:0}
.catlist .cn{min-width:0;overflow-wrap:anywhere}
.catlist .cbar{height:6px;border-radius:3px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.catlist .cbar i{display:block;height:100%;background:var(--cc)}
.catlist .cv{font:600 14px var(--f-num);font-variant-numeric:tabular-nums;text-align:right;min-width:64px}
.catlist li.tot{border-top:1px solid var(--line);font-weight:700}

/* pay periods */
.cyc details{border-top:1px solid var(--line)}
.cyc summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;gap:10px}
.cyc summary::-webkit-details-marker{display:none}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;gap:12px;align-items:center}
.cdate{font-weight:600}
.cmeta{color:var(--muted);font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cnum{font:600 17px var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.cnum small{display:block;font:500 10.5px var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cnum.bad{color:var(--bad)}
.chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-3px;transition:transform .15s}
details[open] .chev{transform:rotate(-135deg);margin-top:3px}
.track{height:6px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--bg)}
.track i{display:block;height:100%;background:var(--accent)}
.items{list-style:none;margin:0;padding:0 16px 12px}
.items li{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.items .d{color:var(--muted);font:500 12.5px var(--f-num);padding-top:2px}
.items .n{min-width:0;overflow-wrap:anywhere}
.items .a{font:500 14px var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.items li.tot{font-weight:600}
.items li.pay .a{color:var(--good)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead h2{margin:0;text-align:center}
.calhead small{display:block;text-align:center;color:var(--muted);font:500 12px var(--f-num)}
.navb{width:44px;height:44px;flex:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;color:var(--ink);font-size:20px;cursor:pointer}
.navb[disabled]{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:12px}
.wd{font:600 10.5px var(--f-num);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:center;padding:2px 0}
.day{position:relative;min-height:60px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:4px 4px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;cursor:pointer;font:inherit;text-align:left;overflow:hidden}
.day.blank{visibility:hidden}
.day.past{opacity:.4}
.day.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.pay::after{content:"";position:absolute;left:4px;right:4px;bottom:3px;height:3px;border-radius:2px;background:var(--accent)}
.dn{font:600 12px/1.4 var(--f-num)}
.day.today .dn{background:var(--ink);color:var(--bg);border-radius:99px;padding:0 5px}
.day.low .dn{color:var(--bad)}
.day.today.low .dn{background:var(--bad);color:var(--surface)}
.dots{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--cc)}
.dots b{font:600 9px var(--f-num);color:var(--muted)}
.damt{font:500 10px var(--f-num);color:var(--muted);margin-top:auto;white-space:nowrap}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:12px 0 0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.legend .pb{width:14px;height:3px;border-radius:2px;background:var(--accent)}
.legend .lowk{font:600 12px var(--f-num);color:var(--bad)}

/* bills */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13.5px var(--f-body);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip span{font:500 11px var(--f-num);opacity:.7}
.blist{list-style:none;margin:0;padding:0}
.blist>li{border-top:1px solid var(--line)}
.blist>li:first-child{border-top:0}
.brow{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto 12px;gap:12px;align-items:center;padding:12px 16px;background:none;border:0;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.brow .bn{font-weight:600;display:block;overflow-wrap:anywhere}
.brow .bs{display:block;color:var(--muted);font-size:13px}
.brow .bamt{font:600 15px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.blist li.off .bn,.blist li.off .bamt{opacity:.5}
.blist li.open{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.blist li.open .chev{transform:rotate(-135deg);margin-top:3px}
.dup{margin:0 16px 12px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.dup p{margin:0;color:inherit}
.dup .btn.ghost{color:var(--warn);border-color:var(--warn)}
.editor{padding:0 16px 16px}
.editor .fields{margin-top:0}
.empty{padding:18px 16px;color:var(--muted)}
.cats{list-style:none;margin:8px 0 0;padding:0}
.cats li{display:grid;grid-template-columns:44px minmax(0,1fr) auto 36px;gap:8px;align-items:center;padding:6px 0}
.swatch{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center}
.swatch::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--cc)}
.ccount{font:500 12px var(--f-num);color:var(--muted);white-space:nowrap}
.x{width:36px;height:36px;border:0;background:none;color:var(--muted);font-size:22px;border-radius:8px;cursor:pointer}
.x.confirm{color:var(--bad);font-size:12px;font-weight:700}
.n small,.catlist .cn small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.items .n small{padding-left:17px}
.phead{display:grid;grid-template-columns:minmax(0,1fr) 92px auto 36px;gap:8px;margin-top:8px;font:600 10.5px var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ppl{list-style:none;margin:4px 0 0;padding:0}
.ppl li{display:grid;grid-template-columns:minmax(0,1fr) 92px auto 36px;gap:8px;align-items:center;padding:6px 0}
.pct{position:relative;display:block}
.pct input{padding-right:26px}
.pct i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:500 14px var(--f-num);font-style:normal;color:var(--muted);pointer-events:none}
.blist>li.grp{background:none}
.ghead{display:grid;gap:2px;padding:12px 16px 4px}
.gname{font:700 12px var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gmeta{font-size:12.5px;color:var(--muted)}
.blist.sub{margin:0 0 6px 16px;border-left:2px solid var(--line)}
.blist.sub>li{border-top:1px dashed var(--line)}
.blist.sub>li:first-child{border-top:0}
.pblock{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:10px}
.pblock.open{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.pblock.nobody{background:color-mix(in srgb,var(--warn-soft) 45%,transparent)}
.ptop{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;gap:12px;align-items:center;list-style:none;cursor:pointer}
.ptop::-webkit-details-marker{display:none}
.pblock:not([open]){gap:0}
.pname{font:700 17px/1.2 var(--f-body)}
.ptop .bs{color:var(--muted);font-size:13px;margin-top:2px}
.ppay{font:600 20px var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ppay small{display:block;font:600 10.5px var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pbills{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.pbills li+li{border-top:1px solid var(--line)}
.pbill{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.pbill .n{min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:14.5px}
.pbill .n small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.pbill .a{font:600 14px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.pblock .editor{padding:0}
.topr{display:flex;align-items:center;gap:10px}
.gear{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.gear[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sethead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sethead h2{font:700 20px/1.2 var(--f-body);margin:0}
.sechd{font:600 11px var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 -4px}
.balrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end}
.balrow .note{margin:0 0 10px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
@media (max-width:380px){.balrow{grid-template-columns:1fr}}
.tempbox{margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.tempbox .fields{margin-top:8px}
.chlist{list-style:none;margin:6px 0 0;padding:0;font-size:14px}

<body>
<div class="wrap" id="app"></div>

<script>
/*LOGIC_START*/
const KEY='billbuffer.v1';
const SERVER_MODE=true;
const D=(y,m,d)=>Math.floor(Date.UTC(y,m,d)/864e5);
const ymd=n=>{const t=new Date(n*864e5);return [t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()];};
const daysInMonth=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();
const parseISO=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?D(+m[1],+m[2]-1,+m[3]):null;};
const toISO=n=>new Date(n*864e5).toISOString().slice(0,10);
const dow=n=>new Date(n*864e5).getUTCDay();
function today(){const t=new Date();return D(t.getFullYear(),t.getMonth(),t.getDate());}
function addMonths(n,k,dom){const [y,m,d]=ymd(n);const t=m+k;const yy=y+Math.floor(t/12),mm=((t%12)+12)%12;return D(yy,mm,Math.min(dom||d,daysInMonth(yy,mm)));}
const median=a=>{const s=a.slice().sort((x,y)=>x-y);const h=s.length>>1;return s.length%2?s[h]:(s[h-1]+s[h])/2;};

const CADS=[['weekly','Weekly'],['fortnightly','Every 2 weeks'],['monthly','Monthly'],['quarterly','Every 3 months'],['yearly','Yearly']];
const PER_YEAR={weekly:365.25/7,fortnightly:365.25/14,monthly:12,quarterly:4,yearly:1};
const DEFAULT_CATS=()=>[{id:'housing',name:'Housing',color:0},{id:'utilities',name:'Utilities',color:1},{id:'insurance',name:'Insurance',color:2},{id:'subs',name:'Subscriptions',color:3},{id:'other',name:'Other',color:4}];
function guessCategory(n){
  const s=String(n).toUpperCase();
  if(/RENT|MORTGAGE|STRATA|COUNCIL|RATES|HOME LOAN/.test(s))return 'housing';
  if(/ENERGY|ELECTRIC|\bGAS\b|WATER|ORIGIN|\bAGL\b|ALINTA|\bNBN\b|BROADBAND|TELSTRA|OPTUS|VODAFONE|INTERNET|MOBILE|PHONE|\bTPG\b|IINET|AMAYSIM|BELONG/.test(s))return 'utilities';
  if(/INSUR|MEDIBANK|BUPA|\bNIB\b|\bHCF\b|\bAHM\b|AAMI|NRMA|RACV|RACQ|ALLIANZ|BUDGET DIRECT|YOUI|SUNCORP|\bGIO\b|REGO|REGISTRATION/.test(s))return 'insurance';
  if(/NETFLIX|SPOTIFY|\bSTAN\b|DISNEY|AMAZON|APPLE|GOOGLE|YOUTUBE|BINGE|KAYO|FOXTEL|\bGYM\b|FITNESS|ANYTIME|PATREON|MICROSOFT|ADOBE|DROPBOX|PARAMOUNT/.test(s))return 'subs';
  return 'other';
}

const DEFAULT_PEOPLE=()=>[{id:'p1',name:'You',nextPayday:'',freq:'fortnightly',payIn:''},{id:'p2',name:'Partner',nextPayday:'',freq:'fortnightly',payIn:''}];
const FREQ={weekly:{label:'Every week',days:7,per:365.25/7},fortnightly:{label:'Every fortnight',days:14,per:365.25/14},'4weekly':{label:'Every 4 weeks',days:28,per:365.25/28},monthly:{label:'Every month',per:12}};
const freqFromDays=n=>+n===7?'weekly':+n===28?'4weekly':'fortnightly';
let S=null;
const defaults=()=>({v:2,example:false,settings:{nextPayday:'',payDays:14,buffer:200,balance:'',contribution:''},categories:DEFAULT_CATS(),people:DEFAULT_PEOPLE(),bills:[],hidden:[],notDup:[],txns:[],files:[],meta:{lastBackup:null,changed:null}});

/* ---------- CSV reading ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/,1)[0]||'';
  const cnt=ch=>first.split(ch).length-1;
  const delim=(cnt('\t')>cnt(',')&&cnt('\t')>cnt(';'))?'\t':(cnt(';')>cnt(',')?';':',');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===delim){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur);cur='';rows.push(row);row=[]; }
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function parseAmt(s){
  if(s==null)return null;let t=String(s).trim();if(!t)return null;let neg=false;
  if(/^\(.*\)$/.test(t)){neg=true;t=t.slice(1,-1);}
  if(/dr$/i.test(t)){neg=true;t=t.replace(/dr$/i,'');}
  t=t.replace(/cr$/i,'');
  if(/-$/.test(t)){neg=true;t=t.slice(0,-1);}
  t=t.replace(/[$,\s]/g,'');
  if(t[0]==='-'){neg=true;t=t.slice(1);} else if(t[0]==='+')t=t.slice(1);
  if(!/^\d+(\.\d+)?$/.test(t))return null;
  const v=parseFloat(t);return neg?-v:v;
}
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function valid(y,m,d){if(m<0||m>11||d<1||d>daysInMonth(y,m))return null;return D(y,m,d);}
function parseDate(s,order){
  s=String(s||'').trim();let m;
  if((m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/)))return valid(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;const a=+m[1],b=+m[2];return order==='mdy'?valid(y,a-1,b):valid(y,b-1,a);}
  if((m=s.match(/^(\d{1,2})[ -]([A-Za-z]{3})[A-Za-z]*[ ,-]+(\d{2,4})/))){const mo=MON[m[2].toLowerCase()];if(mo==null)return null;let y=+m[3];if(y<100)y+=2000;return valid(y,mo,+m[1]);}
  return null;
}
function detectOrder(vals){
  let dmy=false,mdy=false;
  vals.forEach(v=>{const m=String(v).trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-]\d{2,4}/);if(m){if(+m[1]>12)dmy=true;if(+m[2]>12)mdy=true;}});
  return (mdy&&!dmy)?'mdy':'dmy';
}
function extract(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>String(c).trim()));
  if(rows.length<2)return {err:'No rows found.'};
  const head=rows[0].map(c=>String(c).trim().toLowerCase());
  const hasHeader=!rows[0].some(c=>parseDate(c)!=null)&&head.some(c=>/date|desc|amount|debit|credit|narr|detail|balance/.test(c));
  const body=hasHeader?rows.slice(1):rows;
  const ci={};
  if(hasHeader){
    head.forEach((c,i)=>{
      if(/balance/.test(c))return;
      if(/date/.test(c)){if(ci.date==null||(/^value/.test(head[ci.date])&&!/^value/.test(c)))ci.date=i;return;}
      if(ci.debit==null&&/debit|withdraw|money out|paid out/.test(c))ci.debit=i;
      else if(ci.credit==null&&/credit|deposit|money in|paid in/.test(c))ci.credit=i;
      else if(ci.amount==null&&/amount|value/.test(c))ci.amount=i;
      else if(ci.desc==null&&/desc|detail|narr|payee|memo|particulars|reference/.test(c))ci.desc=i;
    });
  } else {
    const sample=body.slice(0,15);const n=rows[0].length;const stat=[];
    for(let j=0;j<n;j++){
      const vals=sample.map(r=>r[j]);
      stat.push({j,date:vals.filter(v=>parseDate(v)!=null).length/vals.length,num:vals.filter(v=>parseDate(v)==null&&parseAmt(v)!=null).length/vals.length,len:vals.reduce((a,v)=>a+String(v||'').length,0)/vals.length});
    }
    const dc=stat.filter(s=>s.date>=.8).sort((a,b)=>b.date-a.date)[0];
    if(dc)ci.date=dc.j;
    const nums=stat.filter(s=>s.num>=.8);
    if(nums.length)ci.amount=nums[0].j;
    const txt=stat.filter(s=>s.j!==ci.date&&!nums.includes(s)).sort((a,b)=>b.len-a.len)[0];
    if(txt)ci.desc=txt.j;
  }
  if(ci.date==null)return {err:"Couldn't find a date column."};
  if(ci.amount==null&&ci.debit==null)return {err:"Couldn't find an amount or debit column."};
  const order=detectOrder(body.map(r=>r[ci.date]));
  const parsed=[];
  body.forEach(r=>{
    const d=parseDate(r[ci.date],order);if(d==null)return;
    let desc=ci.desc!=null?String(r[ci.desc]||'').trim():'';
    if(!desc)desc=r.filter((c,i)=>i!==ci.date&&i!==ci.amount&&i!==ci.debit&&i!==ci.credit&&parseAmt(c)==null).join(' ').trim();
    let v=null;
    if(ci.debit!=null){const dv=parseAmt(r[ci.debit]);if(dv)v=-Math.abs(dv);else if(ci.credit!=null&&parseAmt(r[ci.credit]))v=Math.abs(parseAmt(r[ci.credit]));else v=0;}
    else v=parseAmt(r[ci.amount]);
    if(v==null)return;
    parsed.push({d,t:desc,v});
  });
  if(!parsed.length)return {err:'No dated rows could be read.'};
  const anyNeg=parsed.some(p=>p.v<0);
  const txns=parsed.filter(p=>anyNeg?p.v<0:p.v>0).map(p=>({d:p.d,t:p.t,a:Math.abs(p.v)}));
  if(!txns.length)return {err:'No payments out found.'};
  return {txns,unsigned:!anyNeg};
}
function mergeTxns(newT){
  const key=t=>t.d+'|'+t.a.toFixed(2)+'|'+t.t;
  const have={};S.txns.forEach(t=>{have[key(t)]=(have[key(t)]||0)+1;});
  const inc={};newT.forEach(t=>{(inc[key(t)]=inc[key(t)]||[]).push(t);});
  let added=0;
  for(const k in inc){const need=inc[k].length-(have[k]||0);for(let i=0;i<need;i++){S.txns.push(inc[k][i]);added++;}}
  return added;
}

/* ---------- finding recurring bills ---------- */
const STOP=new Set('VISA PURCHASE DEBIT DIRECT EFTPOS CARD AUS AU PAYMENT BPAY TRANSFER ONLINE INTERNET FROM TO VALUE DATE PTY LTD THE PAY REF RECEIPT AUTH PENDING EFT POS AUSTRALIA NSW VIC QLD WA SA TAS ACT NT MELBOURNE SYDNEY IN OSKO INTERNAL JAN FEB MAR APR MAY JUN JUL AUG SEP SEPT OCT NOV DEC MON TUE WED THU FRI SAT SUN'.split(' '));
const SKIP=/\b(SALARY|WAGES|PAYROLL|INTEREST|REFUND)\b|ROUND UP/;
/* The payee part of a bank description. Many banks write "Payee - Type - Receipt 123 ...",
   so only the part before the first " - " is used. Transfers to the same account number
   are grouped by that account, whatever the description says. */
function payeeHead(s){s=String(s);return s.includes(' - ')?s.split(' - ')[0]:s;}
function payeeKey(s){

const titleCase=s=>s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const monthKey=d=>{const [y,m]=ymd(d);return y*12+m;};

function detect(txns){

  for(const k in g){
    const nc={};g[k].forEach(t=>{const n=cleanName(payeeHead(t.t));if(n)nc[n]=(nc[n]||0)+1;});
    detectName=titleCase(Object.entries(nc).sort((a,b)=>b[1]-a[1])[0]?.[0]||k);
    const arr=g[k].slice().sort((a,b)=>a.d-b.d);if(arr.length<2)continue;

const nextDue=(b,t)=>occurrences(b,t,t+800)[0];

function findDups(t){

/* ---------- the plan ---------- */
function payDates(x,from,to){

  const out=[];for(let d=a+Math.ceil((from-a)/f.days)*f.days;d<to;d+=f.days)out.push(d);return out;

function computePlan(){

  const cat=new Map(S.categories.map(c=>[c.id,0]));

  const perFn=[...cat.values()].reduce((a,b)=>a+b,0);

  // next payment from that day. A planned change shows up in the pay-ins before it's due.
  const people=ppl.map(x=>{
    const f=FREQ[x.freq]||FREQ.fortnightly,own=act.filter(b=>b.owner===x.id);
    const perPayOn=d=>own.reduce((n,b)=>{const nd=nextDue(b,d);return n+(nd==null?annual(b):annualOn(b,nd));},0)/f.per;

  ev.sort((a,b)=>a.d-b.d||(a.pay&&!b.pay?-1:b.pay&&!a.pay?1:b.amt-a.amt));

  // before the end of each person's next pay run, counting the pay-ins that arrive before then.
  // Pay-ins stay steady (each person's bills spread over their pay cycle), so weekly bills are
  // always met by the regular pay-in and monthly ones are counted where they actually land.

  segs.forEach(g=>{g.tight=g.total>=avg*1.2&&g.total-avg>=50;});

}

/* ---------- loading and restoring saved data safely ---------- */
function cleanState(st,keepExample){
  const d=defaults(),num=x=>typeof x==='number'&&isFinite(x),str=x=>typeof x==='string';
  if(Array.isArray(st.categories)){
    const seen=new Set();

      .map(c=>({id:c.id,name:c.name.trim().slice(0,40),color:num(c.color)?Math.abs(Math.round(c.color))%8:4}));
    if(cs.length)d.categories=cs;
  }
  if(!d.categories.some(c=>c.id==='other'))d.categories.push({id:'other',name:'Other',color:4});
  if(Array.isArray(st.people)){
    const seenP=new Set();
    d.people=st.people.filter(x=>x&&str(x.id)&&x.id!=='shared'&&str(x.name)&&x.name.trim()&&!seenP.has(x.id)&&seenP.add(x.id))
      .map(x=>({id:x.id,name:x.name.trim().slice(0,30),
        nextPayday:parseISO(x.nextPayday)!=null?x.nextPayday:'',freq:FREQ[x.freq]?x.freq:'',payIn:(x.payIn===''||x.payIn==null||isNaN(+x.payIn))?'':+x.payIn}));
    if(!d.people.length)d.people=DEFAULT_PEOPLE();
  }
  {const os=st.settings||{};d.people.forEach(x=>{
    if(!x.nextPayday&&parseISO(os.nextPayday)!=null)x.nextPayday=os.nextPayday;
    if(!x.freq)x.freq=freqFromDays(os.payDays);
  });}
  const pids=new Set(d.people.map(x=>x.id));
  const ids=new Set(d.categories.map(c=>c.id));
  d.bills=(Array.isArray(st.bills)?st.bills:[]).filter(b=>b&&str(b.id)&&str(b.name)&&num(b.amount)&&PER_YEAR[b.cadence]&&parseISO(b.anchor)!=null)
    .map(b=>{const g=guessCategory(b.name);return Object.assign({},b,{
      include:!!b.include,dom:num(b.dom)?b.dom:ymd(parseISO(b.anchor))[2],src:b.src==='auto'?'auto':'manual',
      changes:(Array.isArray(b.changes)?b.changes:[]).filter(c=>c&&num(+c.amount)&&+c.amount>=0&&parseISO(c.from)!=null&&(!c.until||(parseISO(c.until)!=null&&parseISO(c.until)>=parseISO(c.from))))
        .map(c=>({id:str(c.id)?c.id:'c'+Math.random().toString(36).slice(2,8),amount:+c.amount,from:c.from,until:c.until||null})),
      txs:Array.isArray(b.txs)?b.txs.filter(t=>t&&num(t.d)&&num(t.a)).map(t=>({d:t.d,a:t.a})):[],grp:str(b.grp)?b.grp:(grpOf(b)||undefined),
      locked:!!(b.locked||b.edited||b.src!=='auto'),owner:pids.has(b.owner)?b.owner:'',category:ids.has(b.category)?b.category:(ids.has(g)?g:'other')});});
  d.hidden=(Array.isArray(st.hidden)?st.hidden:[]).filter(str);
  d.notDup=(Array.isArray(st.notDup)?st.notDup:[]).filter(str);
  d.txns=(Array.isArray(st.txns)?st.txns:[]).filter(t=>t&&num(t.d)&&num(t.a)&&str(t.t));
  d.files=(Array.isArray(st.files)?st.files:[]).filter(f=>f&&str(f.name)&&num(f.from)&&num(f.to)).map(f=>({name:f.name,from:f.from,to:f.to,rows:num(f.rows)?f.rows:0,added:num(f.added)?f.added:0}));
  const s=st.settings||{};const opt=v=>(v===''||v==null||isNaN(+v))?'':+v;
  d.settings={nextPayday:parseISO(s.nextPayday)!=null?s.nextPayday:'',payDays:num(+s.payDays)&&+s.payDays>=1&&+s.payDays<=31?+s.payDays:14,
    buffer:num(+s.buffer)&&+s.buffer>=0?+s.buffer:200,balance:opt(s.balance),contribution:opt(s.contribution),autoStrip:!!s.autoStrip};
  const m=st.meta||{};d.meta={lastBackup:str(m.lastBackup)?m.lastBackup:null,changed:num(m.changed)?m.changed:null};
  d.example=keepExample?!!st.example:false;
  return d;
}

/* ---------- one shared copy on the household server ----------
   The hosted app keeps no copy of the bills on the device. Everything is read from and saved
   straight to the server, so every device works on the same version. If someone else saves
   first, the save is refused and the latest version is shown instead of overwriting it.
   With a passcode set on the server, each device signs in once and gets its own token. */
var Sync={open:false,mode:SERVER_MODE?'loading':'local',status:'',timer:null,poll:null,lastOk:null,busy:false,gen:0,dirty:false,signinErr:'',confirmAll:false,notice:'',down:false};
const SKEY='billbuffer.sync';
let SY=(()=>{try{const o=JSON.parse(localStorage.getItem(SKEY))||{};return {token:o.token,device:o.device};}catch(e){return {};}})();
let serverVersion=0;
function sySave(){try{localStorage.setItem(SKEY,JSON.stringify({token:SY.token,device:SY.device}));}catch(e){}}
const guessDevice=()=>/Android|iPhone|Mobile/i.test(navigator.userAgent)?'Phone':'Computer';
async function api(method,path,body){
  const hd={'Content-Type':'application/json','X-BB-Device':(SY.device||guessDevice()).replace(/[^\x20-\x7e]/g,'')};
  if(SY.token)hd.Authorization='Bearer '+SY.token;
  const r=await fetch('api/'+path,{method,headers:hd,body:body?JSON.stringify(body):undefined,cache:'no-store',credentials:'omit'});
  let j=null;try{j=await r.json();}catch(e){}
  return {status:r.status,data:j};
}
function canApplyRemote(){const a=document.activeElement;return !editing&&!editingP&&!pendingRestore&&!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));}
function syncChip(){
  if(Sync.mode!=='on')return `<small id="syncChip">${esc(fmtDay(today()))}</small>`;
  const map={synced:['good','Saved'],saving:['acc','Saving…'],offline:['bad','Not connected']};
  const [k,l]=map[Sync.status]||['acc','Loading…'];
  return `<span id="syncChip" class="pill ${k}" role="status">${l}</span>`;
}
function setSyncStatus(s){Sync.status=s;const el=$('#syncChip');if(el)el.outerHTML=syncChip();}
function takeServer(cur){serverVersion=cur.version||0;S=cur.state?cleanState(cur.state,false):defaults();Sync.dirty=false;Sync.lastOk=Date.now();}
async function loadFromServer(){
  try{
    const r=await api('GET','state');
    if(r.status===401)return signedOut();
    if(r.status!==200)throw 0;
    takeServer(r.data);Sync.down=false;Sync.mode='on';setSyncStatus('synced');render();
  }catch(e){Sync.down=true;Sync.mode='on';Sync.status='offline';render();}
}
function queuePush(){
  if(Sync.mode!=='on')return;
  Sync.gen++;Sync.dirty=true;clearTimeout(Sync.timer);Sync.timer=setTimeout(pushNow,350);setSyncStatus('saving');
}
async function pushNow(){
  clearTimeout(Sync.timer);Sync.timer=null;
  if(Sync.mode!=='on'||!Sync.dirty)return;
  if(Sync.busy){Sync.timer=setTimeout(pushNow,300);return;}
  Sync.busy=true;const gen=Sync.gen;
  try{
    const r=await api('PUT','state',{base:serverVersion,state:S});
    if(r.status===200){
      serverVersion=r.data.version;Sync.lastOk=Date.now();Sync.down=false;
      if(Sync.gen===gen){Sync.dirty=false;setSyncStatus('synced');}else Sync.timer=setTimeout(pushNow,100);
    } else if(r.status===409){
      const who=r.data&&r.data.updatedBy?r.data.updatedBy:'Someone else';
      takeServer(r.data);editing=null;editingP=null;
      Sync.notice=`${who} saved a change just before you, so your last change wasn't saved. This is the latest version. Please make your change again.`;
      setSyncStatus('synced');render();
    } else if(r.status===401){Sync.busy=false;return signedOut();}
    else throw 0;
  }catch(e){
    Sync.dirty=false;Sync.down=true;
    Sync.notice="Your last change wasn't saved because the server can't be reached. The latest version will load when it's back.";
    setSyncStatus('offline');render();
  }
  Sync.busy=false;
}
async function pullNow(){
  if(Sync.mode!=='on'||Sync.busy||Sync.dirty)return;
  try{
    const wasDown=Sync.down;
    const r=await api('GET',wasDown?'state':'state?since='+serverVersion);
    if(r.status===401)return signedOut();
    if(r.status!==200)throw 0;
    Sync.down=false;Sync.lastOk=Date.now();
    if(r.data.unchanged){setSyncStatus('synced');if(wasDown)render();return;}
    if(canApplyRemote()||wasDown){takeServer(r.data);setSyncStatus('synced');render();}
  }catch(e){if(!Sync.down){Sync.down=true;setSyncStatus('offline');render();}}
}
function startPolling(){stopPolling();Sync.poll=setInterval(()=>{if(document.visibilityState==='visible')pullNow();},15000);}
function stopPolling(){clearInterval(Sync.poll);Sync.poll=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullNow();});
window.addEventListener('online',()=>pullNow());
function signedOut(){
  stopPolling();clearTimeout(Sync.timer);
  SY={device:SY.device};sySave();S=defaults();Sync.open=false;serverVersion=0;
  Sync.mode='signin';Sync.status='';Sync.notice='';
  render();
}
async function boot(){
  if(!SERVER_MODE){render();return;}
  render();
  let st=null;
  try{const r=await fetch('api/status',{cache:'no-store',credentials:'omit'});if(r.ok)st=await r.json();}catch(e){}
  if(!st||st.app!=='bill-buffer'){Sync.mode='on';Sync.down=true;Sync.status='offline';startPolling();render();return;}
  if(!st.ready){Sync.mode='nopass';render();return;}
  Sync.open=!!st.open;
  if(Sync.open){if(!SY.device){SY.device=guessDevice();sySave();}}
  else if(!SY.token){Sync.mode='signin';render();return;}
  Sync.mode='on';startPolling();await loadFromServer();
}
async function doSignin(){
  const pass=$('#si-pass').value,device=($('#si-dev').value||'').trim()||guessDevice();
  if(!pass){Sync.signinErr='Enter the household passcode.';render();return;}
  let r;
  try{r=await api('POST','login',{passcode:pass,device});}catch(e){Sync.signinErr="Can't reach the server. Check you're on your home network.";render();return;}
  if(r.status===200&&r.data&&r.data.token){
    SY={token:r.data.token,device};sySave();
    Sync.signinErr='';Sync.mode='on';startPolling();await loadFromServer();return;
  }
  if(r.status===429){const m=Math.max(1,Math.ceil(((r.data&&r.data.retryAfter)||900)/60));Sync.signinErr=`Too many wrong tries. Try again in ${plural(m,'minute')}.`;}
  else if(r.status===401){const n=r.data&&r.data.triesLeft;Sync.signinErr=`That passcode isn't right.${n>0?` ${plural(n,'try','tries')} left before a 15 minute lockout.`:''}`;}
  else if(r.status===503){Sync.mode='nopass';}
  else if(r.status===400){Sync.mode='on';Sync.open=true;startPolling();await loadFromServer();return;}
  else Sync.signinErr='Sign-in failed. Try again.';
  render();
}
function signinHtml(){
  return `<section class="card"><h2>Sign in to your household</h2><p>Enter the household passcode once on this device.</p>
    <form id="signinForm" autocomplete="on"><div class="fields">
      <div class="field wide"><label for="si-pass">Household passcode</label><input id="si-pass" type="password" autocomplete="current-password"></div>
      <div class="field wide"><label for="si-dev">Name this device</label><input id="si-dev" type="text" maxlength="40" value="${esc(SY.device||guessDevice())}"></div>
    </div><div class="btnrow"><button class="btn" type="submit">Sign in</button></div></form>
    ${Sync.signinErr?`<div class="msg bad" role="status">${esc(Sync.signinErr)}</div>`:''}</section>`;
}
function nopassHtml(){
  return `<section class="card"><h2>Passcode too short</h2><p>The server has a passcode set, but it's shorter than 8 characters, so sign-in is switched off.</p>
    <ol class="steps"><li>In TrueNAS, open Apps, then bill-buffer, then Edit.</li><li>Make <code>BB_PASSCODE</code> at least 8 characters, or empty it to use the app without a passcode.</li><li>Save. The app restarts.</li></ol></section>`;
}
function downHtml(){
  return `<section class="card"><h2>Can't reach your server</h2><p>Bill Buffer works straight from your server, so it needs a connection to show or change the bills. Check this device is on your home network (or Tailscale) and that the app is running in TrueNAS.</p>
    <div class="btnrow"><button class="btn" data-act="retry">Try again</button></div><p class="note">It also retries by itself every 15 seconds.</p></section>`;
}
function noticeHtml(){
  if(!Sync.notice)return '';
  return `<section class="banner"><p>${esc(Sync.notice)}</p><button class="btn small" data-act="dismissNotice">OK</button></section>`;
}
function syncCardHtml(){
  if(Sync.mode!=='on')return '';
  const head=`<section class="card"><h2>Shared copy ${syncChip().replace('id="syncChip"','')}</h2>
    <p>The bills live only on your server. Every device reads and saves that one copy, so everyone always sees the same version.${Sync.lastOk?' Last checked '+esc(ago(Sync.lastOk))+'.':''}</p>`;
  if(Sync.open)return head+`<div class="fields"><div class="field wide"><label for="dev-name">This device's name</label><input id="dev-name" type="text" maxlength="40" value="${esc(SY.device||guessDevice())}" placeholder="Rob's phone"></div></div>
    <p class="note">Shown when this device saves a change. No passcode is set, so anyone on your home network can open the app.</p></section>`;
  return head+`<ul class="files" id="devList"><li><span>Loading devices…</span><span></span></li></ul>
    <div class="btnrow"><button class="btn small ghost" data-act="signOut">Sign out this device</button>
    <button class="btn small danger" data-act="signOutAll">${Sync.confirmAll?'Tap again to sign out all':'Sign out every device'}</button></div></section>`;
}
async function loadDevices(){
  try{const r=await api('GET','devices');if(r.status!==200)throw 0;
    const L=$('#devList');if(!L)return;
    L.innerHTML=r.data.devices.map(d=>`<li><span>${esc(d.device||'Device')}${d.you?' <span class="pill acc">This device</span>':''}</span><span>${d.lastSeen?'used '+esc(ago(d.lastSeen*1000)):''}</span></li>`).join('')||'<li><span>No devices</span><span></span></li>';
  }catch(e){const L=$('#devList');if(L)L.innerHTML='<li><span>Device list unavailable</span><span></span></li>';}
}

const brandHtml=`<h1 class="brand"><span class="logo" aria-hidden="true"></span>Bill Buffer</h1>`;
function render(){
  const tabbar=`<nav class="tabbar" role="tablist" aria-label="Sections">${[['now','Now'],['calendar','Calendar'],['bills','Bills'],['settings','Settings']].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-act="tab" data-tab="${k}"><span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true">${TAB_ICONS[k]}</svg></span>${l}</button>`).join('')}</nav>`;
  const gear=`<button class="gear" data-act="tab" data-tab="settings" aria-label="Settings" aria-pressed="${tab==='settings'}"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>`;
  if(Sync.mode==='loading'){$('#app').innerHTML=`<div class="top">${brandHtml}<small id="syncChip">Loading…</small></div><section class="card"><p>Loading your bills from the server…</p></section>`;return;}
  if(Sync.mode==='on'&&Sync.down&&serverVersion===0&&!Sync.lastOk){$('#app').innerHTML=`<div class="top">${brandHtml}${syncChip()}</div>${downHtml()}`;return;}
  if(Sync.mode==='signin'||Sync.mode==='nopass'){
    $('#app').innerHTML=`<div class="top">${brandHtml}${syncChip()}</div>${Sync.mode==='signin'?signinHtml():nopassHtml()}`;
    const f=$('#si-pass');if(f&&Sync.mode==='signin')f.focus();
    return;
  }
  if(!['now','calendar','bills','settings'].includes(tab))tab='settings';
  const body=tab==='now'?viewNow():tab==='calendar'?viewCalendar():tab==='bills'?viewBills():viewSettings();
  $('#app').innerHTML=`<div class="top">${brandHtml}<div class="topr">${syncChip()}</div></div>${tabbar}${Sync.down&&Sync.mode==='on'?`<section class="banner"><p><strong>Not connected to your server.</strong> Changes can't be saved until it's back.</p><button class="btn small" data-act="retry">Try again</button></section>`:''}${noticeHtml()}${body}`;
  if(tab==='settings'&&Sync.mode==='on'&&!Sync.open)loadDevices();
}

/* ---------- actions ---------- */
function stripStatements(){
  S.bills.forEach(b=>{if(b.src==='auto')b.locked=true;b.txs=[];});
  S.txns=[];S.files=[];
}
function clearExampleData(){S.example=false;S.txns=[];S.bills=[];S.files=[];S.hidden=[];S.notDup=[];S.people=DEFAULT_PEOPLE();}
async function importTexts(items){
  const results=[];const errs=[];
  items.forEach(it=>{const r=extract(it.text);if(r.err)errs.push(`${it.name}: ${r.err}`);else results.push({it,r});});
  if(results.length&&S.example)clearExampleData();
  let total=0;
  results.forEach(({it,r})=>{
    const added=mergeTxns(r.txns);total+=added;const ds=r.txns.map(t=>t.d);
    S.files.push({name:it.name,from:Math.min(...ds),to:Math.max(...ds),rows:r.txns.length,added});
  });
  if(results.length){redetect();if(S.settings.autoStrip)stripStatements();persist();}
  const found=S.bills.filter(b=>b.src==='auto').length;
  const parts=[];
  if(results.length)parts.push(`Added ${plural(total,'payment')}. ${plural(found,'recurring bill')} found. Check them on the Bills tab.${S.settings.autoStrip?' The statement details were removed afterwards.':''}`);
  if(results.some(x=>x.r.unsigned))parts.push('This file shows every amount as positive, so all rows were treated as payments out. Turn off anything that is not a bill.');
  if(errs.length)parts.push(errs.join(' '));
  setMsg('import',parts.join(' '),errs.length&&!results.length?'bad':'good');
  render();
}
function newCategory(name){
  name=name.trim().slice(0,40);if(!name)return null;
  const ex=S.categories.find(c=>c.name.toLowerCase()===name.toLowerCase());if(ex)return ex.id;
  const usedC=new Set(S.categories.map(c=>c.color));let color=0;while(usedC.has(color)&&color<8)color++;if(color>=8)color=S.categories.length%8;
  const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  S.categories.push({id,name,color});return id;
}
function formError(text){
  const ed=document.querySelector('.editor');if(!ed)return;
  let m=ed.querySelector('.msg');if(!m){m=document.createElement('div');m.setAttribute('role','status');ed.appendChild(m);}
  m.className='msg bad';m.textContent=text;
}
function savePerson(){
  const name=$('#p-name').value.trim().slice(0,30),pay=$('#p-pay').value,freq=$('#p-freq').value,pin=$('#p-in').value.trim();
  if(!name){formError('Enter a name.');return;}
  if(parseISO(pay)==null){formError('Enter their next payday.');return;}
  if(pin!==''&&!(+pin>=0)){formError('The amount must be a number, or leave it empty.');return;}
  const fields={name,nextPayday:pay,freq:FREQ[freq]?freq:'fortnightly',payIn:pin===''?'':+pin};
  if(editingP==='new'){
    const n=S.people.length,even=Math.round(100/(n+1));
    const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    S.people.push(Object.assign({id},fields));
  } else {const x=S.people.find(q=>q.id===editingP);if(x)Object.assign(x,fields);}
  editingP=null;msg=null;persist();render();
}
function saveBill(){
  const name=$('#e-name').value.trim(),amt=parseFloat($('#e-amt').value),cad=$('#e-cad').value,date=$('#e-date').value,inc=$('#e-inc').checked;
  let cat=$('#e-cat').value;
  if(!name||!(amt>=0)||parseISO(date)==null){formError('Enter a name, an amount and the next due date.');return;}
  if(cat==='__new'){cat=newCategory($('#e-newcat').value);if(!cat){formError('Type a name for the new category.');return;}}
  const owner=$('#e-own').value;
  if(!S.people.some(x=>x.id===owner)){formError('Choose who pays this bill.');return;}
  const fields={owner,changes:editChanges.map(c=>({...c})),name,amount:Math.round(amt*100)/100,cadence:cad,anchor:date,dom:ymd(parseISO(date))[2],category:cat,include:inc,locked:true};
  if(editing!=='new'){const b0=S.bills.find(x=>x.id===editing);if(b0){const nd0=nextDue(b0,today());
    if(cad===b0.cadence&&nd0!=null&&date===toISO(nd0)){delete fields.anchor;delete fields.dom;}else fields.userDates=true;}}
  else fields.userDates=true;
  if(editing==='new'){
    if(S.example)clearExampleData();
    S.bills.push(Object.assign({id:'m:'+Date.now().toString(36),src:'manual'},fields));
    setMsg('bills',`Added ${name}.`,'good');
  } else {
    const b=S.bills.find(x=>x.id===editing);if(b)Object.assign(b,fields);
    setMsg('bills',`Saved ${name}.`,'good');
  }
  editing=null;confirmDel=null;editChangesFor=null;persist();render();
}
function splitTx(){
  const b=S.bills.find(x=>x.id===editing);if(!b||!Array.isArray(b.txs))return;
  const ticked=new Set([...document.querySelectorAll('[data-tx]:checked')].map(i=>i.dataset.tx));
  if(!ticked.size){formError('Tick at least one payment to split off.');return;}
  const moved=b.txs.filter(x=>ticked.has(x.d+'|'+x.a)),left=b.txs.filter(x=>!ticked.has(x.d+'|'+x.a));
  if(!left.length){formError('Leave at least one payment on this bill.');return;}
  const keepInc=b.include;
  Object.assign(b,seriesFields(left,left.length>=2?null:b.cadence),{locked:true,total:false,grp:grpOf(b)||b.grp,include:keepInc});
  const nb=Object.assign({id:'m:'+Date.now().toString(36),src:'manual',grp:b.grp,name:b.name+' (split)',owner:b.owner,category:b.category,include:true,locked:true},
    seriesFields(moved,moved.length>=2?null:b.cadence));
  S.bills.push(nb);editing=nb.id;confirmDel=null;persist();
  setMsg('editor',`Split ${plural(moved.length,'payment')} into this new bill. Give it a name and check the details, then save.`,'good');render();
  const n=$('#e-name');if(n){n.focus();n.select();}
}
function recheck(){
  const b=S.bills.find(x=>x.id===editing);if(!b)return;const g=grpOf(b);if(!g)return;
  const inherit={category:b.category},ownersById=new Map(S.bills.filter(x=>grpOf(x)===g).map(x=>[x.id,x.owner]));
  S.bills=S.bills.filter(x=>grpOf(x)!==g);
  S.hidden=S.hidden.filter(id=>!(id==='d:'+g||id.startsWith('d:'+g+'|')));
  redetect();
  const now=S.bills.filter(x=>grpOf(x)===g);
  now.forEach(x=>{if(!x.owner&&ownersById.get(x.id))x.owner=ownersById.get(x.id);x.category=inherit.category;});
  editing=null;confirmRecheck=null;persist();
  setMsg('bills',now.length?`Re-checked: found ${plural(now.length,'bill')} for this payee.`:'Re-checked: no regular bill found for this payee.','good');render();
}
function deleteBill(id){
  const b=S.bills.find(x=>x.id===id);if(!b)return;
  if(b.src==='auto'&&!S.hidden.includes(id))S.hidden.push(id);
  S.bills=S.bills.filter(x=>x.id!==id);
  S.notDup=S.notDup.filter(k=>!k.split('~').includes(id));
  if(editing===id)editing=null;confirmDel=null;
  persist();setMsg('bills',`Deleted ${b.name}.`,'good');render();
}
async function saveBackupFile(name,data){
  if(dl){await dl.save({filename:name,data});return;}
  const file=new File([data],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Bill Buffer backup'});return;}
    catch(e){if(e&&e.name==='AbortError')throw {code:'declined'};}
  }
  const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
async function doBackup(){
  try{
    const payload={app:'bill-buffer',version:2,exportedAt:new Date().toISOString(),state:S};
    await saveBackupFile(`bill-buffer-backup-${toISO(today())}.json`,JSON.stringify(payload,null,1));
    S.meta.lastBackup=new Date().toISOString();persist(false);
    setMsg('backup','Backup done. Check that it landed in Drive.','good');
  }catch(e){
    setMsg('backup',e&&e.code==='declined'?'Backup cancelled.':'Could not save the backup'+(e&&e.message?': '+e.message:'.'),'bad');
  }
  render();
}
async function onRestoreFile(file){
  try{
    const o=JSON.parse(await file.text());
    if(!o||o.app!=='bill-buffer'||!o.state||!Array.isArray(o.state.bills)||!Array.isArray(o.state.txns))throw new Error('not a backup');
    pendingRestore={name:file.name,state:o.state,exportedAt:o.exportedAt};msg=null;
  }catch(e){pendingRestore=null;setMsg('restore',"That file isn't a Bill Buffer backup.",'bad');}
  render();
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a!=='reset'&&a!=='stripNow')confirmReset=null;
  if(a!=='signOutAll')Sync.confirmAll=false;
  if(a!=='recheck')confirmRecheck=null;
  if(a!=='delBill')confirmDel=null;
  if(a!=='catDel')confirmCat=null;
  if(a!=='pdel')confirmPerson=null;
  if(a==='tab'){tab=el.dataset.tab;msg=null;pendingRestore=null;editing=null;editingP=null;render();window.scrollTo(0,0);}
  else if(a==='ownerBills'){tab='bills';ownFilter=el.dataset.id;catFilter='all';editing=null;msg=null;render();window.scrollTo(0,0);}
  else if(a==='openSettings'){tab='settings';msg=null;editing=null;render();const s=$('#set-people');if(s)s.scrollIntoView({block:'start'});}
  else if(a==='clearExample'){clearExampleData();persist();render();}
  else if(a==='edit'){const id=el.dataset.id;editing=editing===id?null:id;msg=null;render();}
  else if(a==='new'){editing='new';msg=null;render();const n=$('#e-name');if(n)n.focus();}
  else if(a==='cancelEdit'){editing=null;editChangesFor=null;msg=null;render();}
  else if(a==='saveBill')saveBill();
  else if(a==='chAdd'){
    const am=parseFloat($('#c-amt').value),fr=$('#c-from').value,un=$('#c-until').value;
    const err=m=>{const x=$('#e-chmsg');if(x)x.innerHTML=`<div class="msg bad" role="status">${esc(m)}</div>`;};
    if(!(am>=0))return err('Enter the new amount.');
    if(parseISO(fr)==null)return err('Enter the date the change starts.');
    if(un&&parseISO(un)<parseISO(fr))return err('The end date is before the start date.');
    if(un&&parseISO(un)<today())return err('That end date has already passed.');
    editChanges.push({id:'c'+Date.now().toString(36),amount:Math.round(am*100)/100,from:fr,until:un||null});
    $('#e-chlist').innerHTML=changesListHtml();$('#c-amt').value='';$('#c-until').value='';$('#e-chmsg').innerHTML='';
  }
  else if(a==='chDel'){editChanges=editChanges.filter(c=>c.id!==el.dataset.id);const l=$('#e-chlist');if(l)l.innerHTML=changesListHtml();}
  else if(a==='dismissNotice'){Sync.notice='';render();}
  else if(a==='retry'){if(serverVersion===0&&!Sync.lastOk){Sync.mode='loading';render();boot();}else pullNow();}
  else if(a==='signOut'){try{await api('POST','logout',{});}catch(e){}signedOut();}
  else if(a==='signOutAll'){if(!Sync.confirmAll){Sync.confirmAll=true;render();return;}try{await api('POST','logout-all',{});}catch(e){}Sync.confirmAll=false;signedOut();}
  else if(a==='splitTx')splitTx();
  else if(a==='recheck'){if(confirmRecheck!==editing){confirmRecheck=editing;render();}else recheck();}
  else if(a==='delBill'){const id=el.dataset.id;if(confirmDel===id)deleteBill(id);else{confirmDel=id;render();}}
  else if(a==='dupKeep'){if(!S.notDup.includes(el.dataset.key))S.notDup.push(el.dataset.key);persist();render();}
  else if(a==='filter'){catFilter=el.dataset.cat;editing=null;render();}
  else if(a==='showUnassigned'){tab='bills';ownFilter='none';catFilter='all';editing=null;msg=null;render();}
  else if(a==='ofilter'){ownFilter=el.dataset.own;editing=null;render();}
  else if(a==='gotoBill'){
    tab='bills';catFilter='all';ownFilter='all';editing=el.dataset.id;editingP=null;msg=null;render();
    const row=[...document.querySelectorAll('.brow')].find(x=>x.dataset.id===editing);if(row)row.scrollIntoView({block:'center'});
  }
  else if(a==='pedit'){const id=el.dataset.id;editingP=editingP===id?null:id;msg=null;render();}
  else if(a==='pnew'){editingP='new';msg=null;render();const n=$('#p-name');if(n)n.focus();}
  else if(a==='pcancel'){editingP=null;msg=null;render();}
  else if(a==='psave')savePerson();
  else if(a==='pdel'){
    const id=el.dataset.id;
    if(confirmPerson!==id){confirmPerson=id;render();return;}
    S.bills.forEach(b=>{if(b.owner===id)b.owner='';});
    S.people=S.people.filter(x=>x.id!==id);confirmPerson=null;editingP=null;
    if(ownFilter===id)ownFilter='all';persist();render();
  }
  else if(a==='catColor'){const c=S.categories.find(x=>x.id===el.dataset.id);if(c){c.color=(c.color+1)%8;persist();render();}}
  else if(a==='catAdd'){const v=$('#newCat').value;if(newCategory(v)){persist();render();}}
  else if(a==='catDel'){
    const id=el.dataset.id;
    if(confirmCat!==id){confirmCat=id;render();return;}
    S.bills.forEach(b=>{if(b.category===id)b.category='other';});
    S.categories=S.categories.filter(c=>c.id!==id);confirmCat=null;if(catFilter===id)catFilter='all';persist();render();
  }
  else if(a==='unhide'){S.hidden=[];redetect();persist();setMsg('import','Deleted bills brought back.','good');render();}
  else if(a==='day'){selDay=+el.dataset.d;render();}
  else if(a==='calPrev'||a==='calNext'){const k=calY*12+calM+(a==='calNext'?1:-1);calY=Math.floor(k/12);calM=k%12;
    const t=today();const [ty,tm]=ymd(t);selDay=(calY===ty&&calM===tm)?t:D(calY,calM,1);render();}
  else if(a==='pasteImport'){const v=$('#pasteBox').value;if(!v.trim()){setMsg('import','Paste some rows first.','bad');render();return;}await importTexts([{name:'Pasted rows',text:v}]);}
  else if(a==='backup')doBackup();
  else if(a==='restoreNo'){pendingRestore=null;render();}
  else if(a==='restoreYes'&&pendingRestore){
    S=cleanState(pendingRestore.state,false);
    S.meta.lastBackup=pendingRestore.exportedAt||null;S.meta.changed=Date.now()-5000;persist(false);queuePush();
    pendingRestore=null;editing=null;setMsg('restore','Backup restored.','good');render();
  }
  else if(a==='stripNow'){
    if(confirmReset!=='strip'){confirmReset='strip';render();return;}
    confirmReset=null;stripStatements();persist();setMsg('strip','Statement details removed. Your bills are unchanged.','good');render();
  }
  else if(a==='reset'){
    const k=el.dataset.kind;
    if(confirmReset!==k){confirmReset=k;clearTimeout(clearTimer);clearTimer=setTimeout(()=>{confirmReset=null;if(tab==='settings')render();},5000);render();return;}
    confirmReset=null;editing=null;editingP=null;catFilter='all';ownFilter='all';openSeg.clear();calY=null;
    const keepMeta=S.meta;
    if(k==='statements'){S.txns=[];S.files=[];S.hidden=[];S.bills=S.bills.filter(b=>b.src!=='auto'||b.locked);S.example=false;setMsg('reset','Statements cleared. Your own and edited bills are still there.','good');}
    else if(k==='bills'){S.txns=[];S.files=[];S.hidden=[];S.notDup=[];S.bills=[];S.example=false;setMsg('reset','All bills cleared.','good');}
    else if(k==='all'){S=defaults();S.meta=keepMeta;setMsg('reset','Everything cleared. Add your people and paydays on the Now tab to start.','good');}
    else if(k==='example'){S=buildExample();S.meta=keepMeta;setMsg('reset','Example loaded.','good');}
    persist();render();
  }
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.s){
    const k=el.dataset.s;S.settings[k]=(k==='nextPayday')?el.value:(el.value===''?'':+el.value);
    persist();refreshNow();
  } else if(el.dataset.cat&&el.tagName==='INPUT'){
    const c=S.categories.find(x=>x.id===el.dataset.cat);if(!c)return;
    const v=el.value.trim().slice(0,40);if(v){c.name=v;persist();}else el.value=c.name;
  } else if(el.dataset.qown){
    const b=S.bills.find(x=>x.id===el.dataset.qown);
    if(b&&S.people.some(x=>x.id===el.value)){b.owner=el.value;b.locked=true;persist();setMsg('bills',`${b.name} is now paid by ${ownerName(b.owner)}.`,'good');render();}
  } else if(el.id==='dev-name'){
    const v=el.value.trim().slice(0,40);if(v){SY.device=v;sySave();}else el.value=SY.device||guessDevice();
  } else if(el.id==='autoStrip'){
    S.settings.autoStrip=el.checked;persist();
  } else if(el.id==='e-cat'){
    const w=$('#e-newwrap');if(w){w.hidden=el.value!=='__new';if(!w.hidden)$('#e-newcat').focus();}
  } else if(el.id==='fileCsv'){
    const files=Array.from(el.files||[]);if(!files.length)return;
    const items=[];for(const f of files)items.push({name:f.name,text:await f.text()});
    el.value='';await importTexts(items);
  } else if(el.id==='fileRestore'){
    const f=el.files&&el.files[0];el.value='';if(f)await onRestoreFile(f);
  }
});
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='signinForm'){e.preventDefault();doSignin();}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='newCat'){e.preventDefault();if(newCategory(e.target.value)){persist();render();}}});
document.addEventListener('toggle',e=>{const d=e.target;if(!d||!d.dataset)return;if(d.classList&&d.classList.contains('working'))openWorking=d.open;if(d.dataset.i!=null){const i=+d.dataset.i;if(d.open)openSeg.add(i);else openSeg.delete(i);}if(d.dataset.pid!=null){if(d.open)openPeople.add(d.dataset.pid);else openPeople.delete(d.dataset.pid);}},true);

boot();
(async()=>{try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){dl=null;}})();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
