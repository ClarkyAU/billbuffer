# Bill Buffer for TrueNAS
# Paste into Apps > Discover Apps > Custom App > Install via YAML (or Edit on the existing app).
#
# No passcode by default: any device on your network that opens the address can use it.
# To require sign-in, put a passcode in BB_PASSCODE (8+ characters, no $ sign) and save.
#
# Your bills are stored once, in the "bill-buffer-data" volume on this server, and every device
# works from that one copy. The app itself is downloaded from GitHub each time the container starts.
x-portals:
  - name: Web UI
    scheme: http
    host: 0.0.0.0
    port: 47219
    path: /
services:
  bill-buffer:
    image: python:3.12-alpine
    container_name: bill-buffer
    restart: unless-stopped
    ports:
      - "47219:8080"
    environment:
      BB_PASSCODE: ""
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - bill-buffer-data:/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - python3
      - -u
      - -c
      - |
        import io, runpy, sys, tarfile, time, urllib.request
        URL = "https://codeload.github.com/ClarkyAU/billbuffer/tar.gz/refs/heads/main"
        while True:
            try:
                data = urllib.request.urlopen(URL, timeout=30).read()
                tarfile.open(fileobj=io.BytesIO(data)).extractall("/opt", filter="data")
                break
            except Exception as e:
                print("Could not download Bill Buffer, retrying in 15s:", e, flush=True)
                time.sleep(15)
        sys.argv = ["server.py"]
        runpy.run_path("/opt/billbuffer-main/server.py", run_name="__main__")
volumes:
  bill-buffer-data:
