# The x-portals block gives TrueNAS a Web UI button. Other Docker hosts ignore it.
x-portals:
  - name: Web UI
    scheme: http
    host: 0.0.0.0
    port: 47219
    path: /
services:
  bill-buffer:
    image: ghcr.io/clarkyau/billbuffer:latest
    pull_policy: always
    container_name: bill-buffer
    restart: unless-stopped
    ports:
      - "47219:8080"
    volumes:
      - bill-buffer-data:/data
    # Optional. Leave empty and set a passcode in the app instead (Settings > Passcode).
    environment:
      BB_PASSCODE: ""
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

volumes:
  bill-buffer-data:
