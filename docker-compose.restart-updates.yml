# Bill Buffer, updates on restart.
# Uses a plain Python image and downloads the latest Bill Buffer from GitHub every time the container
# starts. To update: restart the container. No image to pull, nothing to rebuild.
# Needs internet access when it starts. Use docker-compose.yml instead for a pinned, prebuilt image.
#
# No passcode by default. Turn one on in the app (Settings > Passcode), or set BB_PASSCODE below
# (8+ characters, no $ sign), which then takes priority.
#
# TrueNAS: the x-portals block gives the app a Web UI button. Other Docker hosts ignore it.
x-portals:
  - name: Web UI
    scheme: http
    host: 0.0.0.0
    port: 47219
    path: /
services:
  bill-buffer:
    image: python:3.12-alpine
    container_name: bill-buffer
    restart: unless-stopped
    ports:
      - "47219:8080"
    environment:
      BB_PASSCODE: ""
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - bill-buffer-data:/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - python3
      - -u
      - -c
      - |
        import io, runpy, sys, tarfile, time, urllib.request
        URL = "https://codeload.github.com/ClarkyAU/billbuffer/tar.gz/refs/heads/main"
        while True:
            try:
                data = urllib.request.urlopen(URL, timeout=30).read()
                tarfile.open(fileobj=io.BytesIO(data)).extractall("/opt", filter="data")
                break
            except Exception as e:
                print("Could not download Bill Buffer, retrying in 15s:", e, flush=True)
                time.sleep(15)
        sys.argv = ["server.py"]
        runpy.run_path("/opt/billbuffer-main/server.py", run_name="__main__")
volumes:
  bill-buffer-data:
